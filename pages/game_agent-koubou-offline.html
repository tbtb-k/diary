<style>
/* レイアウト：1画面1ステップ。上に「依頼を読む → テストする → 直す」の道しるべ、下に次へ進むボタン。
   読みやすさ優先（UDフォント・本文16px以上・色は落ち着いた青1色＋合格の緑・NGの赤）。 */
:root{
  color-scheme: light;
  --bg:#f3f5f8;   --card:#ffffff;  --sub:#eef2f7;  --line:#d5dbe4; --line-2:#aeb8c6;
  --text:#1c2333; --text-2:#465064; --text-3:#6f7889;
  --accent:#2357c4; --accent-h:#1b469f; --accent-2:#e7eefc; --on-accent:#ffffff;
  --ok:#1d7f46;   --ok-bg:#e5f4eb; --ng:#bf3030;  --ng-bg:#fcebeb;
  --hint:#7a5a00; --hint-bg:#fff5d6; --hint-line:#ecd07a;
  --star:#f0a81a; --star-off:#cdd3dd; --scrim:rgba(18,24,38,.5);
  --r-line:#26314b; --r-head:#3f71e0; --r-body:#bcd0f7; --r-face:#ffffff; --r-badge:#ffd65a;
  --r-b1:#7aa2f7; --r-b2:#6cc6a0; --r-b3:#f2b56b; --r-b4:#c9ced8; --r-danger:#e05656; --r-shadow:rgba(30,40,70,.12);
  --f:"BIZ UDPGothic AK","BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#141922;   --card:#1c2330;  --sub:#232c3b;  --line:#334055; --line-2:#4b5a72;
    --text:#edf0f5; --text-2:#bcc4d3; --text-3:#8f99ac;
    --accent:#7fa6ff; --accent-h:#a3c0ff; --accent-2:#22314f; --on-accent:#0f1624;
    --ok:#62d394;   --ok-bg:#173525; --ng:#ff8f8f;  --ng-bg:#3b1f23;
    --hint:#f3d27a; --hint-bg:#352d18; --hint-line:#6f5c26;
    --star:#f5b833; --star-off:#4a556a; --scrim:rgba(4,7,14,.66);
    --r-line:#e3e8f2; --r-head:#5f8cff; --r-body:#2f4778; --r-face:#e9eef8; --r-badge:#ffd65a;
    --r-b1:#5f86e0; --r-b2:#3fa57a; --r-b3:#d49447; --r-b4:#7d889c; --r-danger:#e46464; --r-shadow:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#141922;   --card:#1c2330;  --sub:#232c3b;  --line:#334055; --line-2:#4b5a72;
  --text:#edf0f5; --text-2:#bcc4d3; --text-3:#8f99ac;
  --accent:#7fa6ff; --accent-h:#a3c0ff; --accent-2:#22314f; --on-accent:#0f1624;
  --ok:#62d394;   --ok-bg:#173525; --ng:#ff8f8f;  --ng-bg:#3b1f23;
  --hint:#f3d27a; --hint-bg:#352d18; --hint-line:#6f5c26;
  --star:#f5b833; --star-off:#4a556a; --scrim:rgba(4,7,14,.66);
  --r-line:#e3e8f2; --r-head:#5f8cff; --r-body:#2f4778; --r-face:#e9eef8; --r-badge:#ffd65a;
  --r-b1:#5f86e0; --r-b2:#3fa57a; --r-b3:#d49447; --r-b4:#7d889c; --r-danger:#e46464; --r-shadow:rgba(0,0,0,.35);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--f); font-size:16px; line-height:1.8; overflow-x:clip}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:90; background:var(--card)}
h1,h2,h3{margin:0; font-weight:700; line-height:1.4; text-wrap:balance; word-break:auto-phrase}
p,ul,ol,dl,dd,pre{margin:0}
ul,ol{padding:0; list-style:none}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important; animation-delay:0s!important; transition-duration:.01ms!important; scroll-behavior:auto!important}}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--text-2); font-size:15px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ボタン */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:12px 24px; border-radius:10px; border:2px solid transparent; font-size:17px; font-weight:700; line-height:1.3; text-align:center; text-decoration:none; transition:background .15s, border-color .15s, transform .1s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent); color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-h)}
.btn.second{background:var(--card); color:var(--accent); border-color:var(--line-2)}
.btn.second:hover{border-color:var(--accent)}
.btn.danger{background:var(--ng); color:var(--card)}
.btn.danger:hover{filter:brightness(.92)}
.t-tools{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-top:16px; padding-top:16px; border-top:1px solid var(--line)}
.t-tools .btn{min-height:44px; padding:8px 16px; font-size:15px}
.flash{margin-top:14px; padding:10px 14px; border-radius:10px; background:var(--ok-bg); color:var(--ok); font-size:15px; font-weight:700}
.dotlist{display:grid; gap:4px; font-size:16px; line-height:1.7}
.dotlist li::before{content:"・"}
.reset-row{margin-top:14px; text-align:right}
.btn.big{min-height:60px; font-size:19px; padding:14px 34px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.link{border:0; background:none; padding:6px 2px; color:var(--accent); font-size:15px; text-decoration:underline; text-underline-offset:3px}

.pill{display:inline-flex; align-items:center; font-size:14px; font-weight:700; line-height:1.4; padding:3px 12px; border-radius:999px; background:var(--accent-2); color:var(--accent); white-space:nowrap}

/* =========================================================

   ========================================================= */

.t-kick{font-size:15px; font-weight:700; color:var(--accent)}

.t-lead{margin-top:16px; font-size:17px; line-height:1.95}
.t-btns{display:flex; flex-wrap:wrap; gap:12px; margin-top:24px}
.t-note{margin-top:14px; font-size:15px; color:var(--text-2)}

.how{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:16px}
@media (max-width:760px){.how{grid-template-columns:1fr}}
.how li{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px}
.how-n{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--accent); color:var(--on-accent); font-weight:700}

.starrule{display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:16px; font-size:15px; color:var(--text-2)}

.reqlist{display:grid; gap:10px; margin-top:16px}
.req-row{width:100%; display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:14px; align-items:center; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; transition:border-color .15s, box-shadow .15s}
.req-row:hover{border-color:var(--accent); box-shadow:0 2px 10px var(--r-shadow)}

/* =========================================================
   プレイ画面
   ========================================================= */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--card); border-bottom:1px solid var(--line)}
.bar-in{max-width:1000px; margin:0 auto; display:flex; align-items:center; gap:12px; min-height:56px}
.home{border:0; background:none; padding:6px 0; font-weight:700; font-size:16px; color:var(--text)}

.main{max-width:1000px; margin:0 auto; padding-block:20px 0}
.head{display:grid; gap:14px; margin-bottom:18px}

.stepper .done button{color:var(--text-2)}
.stepper .done .sn{background:var(--ok-bg); color:var(--ok)}
.stepper .cur button{border:2px solid var(--accent); color:var(--accent); background:var(--accent-2)}

@media (max-width:420px){.stepper button{flex-direction:column; justify-content:center; gap:4px; text-align:center; font-size:14px; padding:8px 4px}}

.view{max-width:760px; margin:0 auto}

.view.wide .a-points{grid-area:points} .view.wide .a-edit{grid-area:edit} .view.wide .a-agent{grid-area:agent}
@media (max-width:900px){.view.wide{grid-template-columns:1fr; grid-template-areas:"points" "edit" "agent"; grid-template-rows:auto}}

.actions{position:sticky; bottom:0; z-index:30; margin-top:20px; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border-top:1px solid var(--line); padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.actions-in{max-width:760px; margin:0 auto; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:flex-end}

.actions-in .btn{flex:0 1 auto}
@media (max-width:560px){.actions-in .btn{flex:1 1 100%}.actions-in .note{flex-basis:100%}}

/* 依頼 */
.req{display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; align-items:start}

.req-who{font-size:15px; color:var(--text-2)}
.req-who b{color:var(--text); font-size:16px}
.bubble{margin-top:6px; background:var(--sub); border-radius:4px 14px 14px 14px; padding:12px 16px; font-size:16px; line-height:1.9}

.goal p{font-size:17px; font-weight:700; margin-top:2px}
.term{margin-top:12px; font-size:15px; color:var(--text-2); line-height:1.85}

.qlist{display:grid; gap:0; margin-top:12px; border:1px solid var(--line); border-radius:12px; overflow:hidden}

.qlist li:first-child{border-top:0}
.qn{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--sub); font-weight:700; font-size:15px}
.q{font-weight:700; font-size:16px; line-height:1.6}
.exp{font-size:15px; color:var(--text-2); line-height:1.6; margin-top:2px}
.qlist .bonus{background:var(--sub)}
.qlist .bonus .qn{background:var(--hint-bg); color:var(--hint)}
.res{flex:none; font-size:14px; font-weight:700; padding:2px 10px; border-radius:999px; white-space:nowrap}
.res.ok{background:var(--ok-bg); color:var(--ok)}
.res.ng{background:var(--ng-bg); color:var(--ng)}
.res.none{background:var(--sub); color:var(--text-3)}

/* エージェントの姿 */
.agent{display:grid; gap:10px}

.slist dt{color:var(--text-2)}
.slist dd{font-weight:700; word-break:break-all}
.slist dd.warn{color:var(--ng)}

/* テスト */
.test-h{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px}
.cases{display:grid; gap:14px; margin-top:14px}
.case{border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; scroll-margin-bottom:120px; background:var(--card)}

.case-h .bonus{color:var(--hint)}
.msg{max-width:90%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-break:break-word; font-size:16px; line-height:1.75}

@keyframes blink{50%{opacity:0}}
.who-l{font-size:13px; color:var(--text-3); margin-bottom:-6px}
.who-l.b{align-self:flex-start} .who-l.u{align-self:flex-end}
.moves{align-self:flex-start; font-size:14px; color:var(--text-2); line-height:1.7; padding:6px 12px; border-radius:8px; background:var(--sub)}
.moves b{font-weight:700; margin-right:6px; color:var(--text-2)}
.moves .bad{color:var(--ng); font-weight:700}
.moves .arr{margin:0 6px; color:var(--text-3)}
.cite{align-self:flex-start; font-size:14px; color:var(--text-2); margin-top:-4px}
.cite b{color:var(--text)}
.verdict{display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; align-items:start; padding:10px 12px; border-radius:10px; animation:fade .3s ease both}
.verdict.ok{background:var(--ok-bg)} .verdict.ng{background:var(--ng-bg)}
.verdict .mk{font-weight:700; font-size:16px; white-space:nowrap}
.verdict.ok .mk{color:var(--ok)} .verdict.ng .mk{color:var(--ng)}
.verdict p{font-size:15px; line-height:1.7}
@keyframes fade{from{opacity:0; transform:translateY(4px)}}
.sess{font-size:14px; color:var(--text-3); text-align:center}
.sum{margin-top:16px; padding:16px; border-radius:12px; display:grid; gap:4px}
.sum.ok{background:var(--ok-bg)} .sum.ng{background:var(--ng-bg)}
.sum-n{font-size:19px; font-weight:700}
.sum.ok .sum-n{color:var(--ok)} .sum.ng .sum-n{color:var(--ng)}

/* 直す */
.fix-list{display:grid; gap:12px; margin-top:12px}

.dirty{margin-top:12px; font-size:15px; padding:10px 14px; border-radius:10px; background:var(--accent-2); color:var(--text)}
.edit h2{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.edit-s + .edit-s{margin-top:22px; padding-top:20px; border-top:1px solid var(--line)}

.cks{display:grid; gap:10px; margin-top:12px}
.ck{display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:12px; align-items:start; padding:12px 14px; border:1px solid var(--line); border-radius:12px; cursor:pointer; transition:border-color .15s, background .15s}
.ck:hover{border-color:var(--accent)}

.ck:has(input:checked) .ck-s{color:var(--accent)}
@media (max-width:560px){.ck{grid-template-columns:28px minmax(0,1fr)} .ck-s.opt{display:none}}
details.fixed{margin-top:12px; border:1px solid var(--line); border-radius:12px; padding:10px 14px; background:var(--sub)}
details.fixed summary{cursor:pointer; font-size:15px; font-weight:700; color:var(--text-2)}

details.fixed li::before{content:"・"}

.dblock{border:1px solid var(--line); border-radius:12px; padding:14px}
.dblock + .dblock{margin-top:12px}
.dname{display:flex; align-items:center; gap:8px; font-weight:700; font-size:17px}

.peek{margin-top:10px; background:var(--sub); border-radius:8px; padding:10px 12px}

.flow{display:grid; gap:0; margin-top:12px; counter-reset:f}

.fb{margin-top:12px; padding:12px 14px; border-radius:10px; font-size:16px; line-height:1.8}
.fb.ok{background:var(--ok-bg)} .fb.ng{background:var(--ng-bg)}
.fb b{display:block}
.fb.ok b{color:var(--ok)} .fb.ng b{color:var(--ng)}
.sort-res{display:grid; gap:8px; margin-top:12px; font-size:15px; line-height:1.7}
.sort-res li{display:flex; gap:10px; align-items:baseline}
.flow4{display:grid; gap:8px; margin-top:14px}
.flow4 li{display:grid; grid-template-columns:36px minmax(0,1fr); gap:12px; align-items:start; padding:12px 14px; border:1px solid var(--line); border-radius:12px; transition:background .35s, border-color .35s}
.flow4 li.lit{border-color:var(--accent); background:var(--accent-2)}
.f4n{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--sub); font-weight:700; transition:background .35s, color .35s}
.flow4 li.lit .f4n{background:var(--accent); color:var(--on-accent)}
.flow4 b{display:block; font-size:17px}
.flow4 li div > span{display:block; font-size:15px; color:var(--text-2); line-height:1.7}
.loop{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px; margin-top:16px; font-weight:700; font-size:17px}
.loop span{padding:8px 18px; border-radius:999px; background:var(--accent-2); color:var(--accent)}
.loop i{font-style:normal; color:var(--text-3)}
.quiz{display:grid; gap:22px; margin-top:14px}
.qz-q{font-size:17px; font-weight:700; line-height:1.7}
.qz-c{display:grid; gap:8px; margin-top:8px}
.qz-c button{text-align:left; padding:12px 14px; border-radius:10px; border:1px solid var(--line-2); background:var(--card); font-size:16px; line-height:1.6}

.qz-c button[disabled]{cursor:default}
.qz-c button.right{border:2px solid var(--ok); background:var(--ok-bg); font-weight:700}
.qz-c button.wrong{border:2px solid var(--ng); background:var(--ng-bg)}

/* ことば図鑑 */
.modal.wide{width:min(680px,100%)}
.m-top{position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px clamp(18px,4vw,28px) 12px; background:var(--card); border-bottom:1px solid var(--line)}
.m-top .btn{min-height:42px; padding:6px 16px; font-size:15px}
.gl{display:grid; gap:10px}
.gl-i{border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.gl-i dt{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; font-size:18px; font-weight:700}
.gl-i dd{font-size:15px; line-height:1.85; margin-top:4px}
.gl-i small{display:block; font-size:13px; color:var(--text-3); margin-top:4px}

/* ロボット */
.robot{display:block; width:100%; height:auto; overflow:visible}
.robot text{font-family:var(--f); font-weight:700}
.robot .pt{transform-box:fill-box; transform-origin:50% 100%}
.robot .pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.5) both}
@keyframes pop{from{transform:scale(.3); opacity:0}}
.robot.assemble .pt{animation:pop .5s cubic-bezier(.2,.9,.3,1.5) both; animation-delay:var(--d,0s)}
.robot .dz{transform-box:fill-box; transform-origin:center; animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* =========================================================
   モーダル
   ========================================================= */
.mwrap{position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px)); background:var(--scrim); animation:fade .2s ease both}
.modal{width:min(560px,100%); max-height:100%; overflow-y:auto; overscroll-behavior:contain; background:var(--card); border-radius:18px; box-shadow:0 12px 40px rgba(0,0,0,.25); animation:rise .3s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes rise{from{transform:translateY(16px); opacity:0}}
.m-in{padding:24px clamp(18px,4vw,28px); display:grid; gap:16px}
.m-h{font-size:clamp(22px,5vw,26px)}
.m-btns{display:flex; flex-wrap:wrap; gap:10px}
.m-btns .btn{flex:1 1 200px}
.clear-top{text-align:center; display:grid; justify-items:center; gap:6px; padding:28px 20px 6px}
.check{width:76px; height:76px; border-radius:50%; display:grid; place-items:center; background:var(--ok); color:var(--card); font-size:42px; font-weight:700; line-height:1; animation:popin .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes popin{from{transform:scale(0)}}
.clear-top h2{font-size:26px; margin-top:6px}
.starlist{display:grid; gap:8px}
.starlist li{display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 14px; border-radius:10px; background:var(--sub); font-size:16px}
.starlist .st{font-size:24px; line-height:1; color:var(--star-off)}
.starlist .on .st{color:var(--star); animation:popin .4s cubic-bezier(.2,.9,.3,1.8) both; animation-delay:var(--d)}
.starlist .gt{font-size:14px; font-weight:700; color:var(--text-3)}
.starlist .on .gt{color:var(--ok)}
.miss{font-size:15px; line-height:1.75; padding:12px 14px; border-radius:10px; background:var(--hint-bg); border:1px solid var(--hint-line)}
.miss b{display:block; color:var(--hint)}
.lesson{padding:16px 18px; border-radius:12px; border:2px solid var(--accent); display:grid; gap:6px}
.lesson .lk{font-size:14px; font-weight:700; color:var(--accent)}
.lesson h3{font-size:20px}
.lesson p{font-size:16px; line-height:1.9}
.minis{display:grid; gap:8px}
.minis div{padding:12px 14px; border-radius:10px; background:var(--accent-2); font-size:15px}
.minis b{display:block; font-size:17px}

/* 修了証 */
.cert{width:min(720px,100%)}
.cert-in{margin:14px; border:2px solid var(--accent); border-radius:12px; padding:clamp(18px,4vw,30px); display:grid; gap:16px; text-align:center}
.cert-k{font-size:14px; font-weight:700; letter-spacing:.2em; color:var(--accent)}
.cert-in h2{font-size:clamp(30px,7vw,40px); letter-spacing:.3em; margin-right:-.3em}
.cert-robot{max-width:240px; margin:0 auto; width:100%}
.cert-name{max-width:360px; margin:0 auto; width:100%; text-align:left}
.cert-name label{font-size:14px; color:var(--text-2)}
.cert-name input{width:100%; border:0; border-bottom:2px solid var(--line-2); background:transparent; font-size:24px; font-weight:700; text-align:center; padding:4px 0; border-radius:0}
.cert-name input:focus{outline:none; border-bottom-color:var(--accent)}
.cert-msg{font-size:16px; line-height:1.9}
.cert-stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px}
.cert-stats div{background:var(--sub); border-radius:10px; padding:10px 4px}
.cert-stats b{display:block; font-size:24px; color:var(--accent); line-height:1.2}
.cert-stats small{font-size:13px; color:var(--text-2)}
.cert-ls{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px 16px; text-align:left; font-size:15px; line-height:1.7}
@media (max-width:520px){.cert-ls{grid-template-columns:1fr}}
.cert-ls li{display:flex; gap:8px}
.cert-ls span{color:var(--accent); font-weight:700}
.cert-date{font-size:14px; color:var(--text-3)}
</style>
</head>
<body>

<noscript><p style="padding:24px">このゲームは JavaScript を使います。ブラウザの設定で JavaScript を有効にしてください。</p></noscript>
<script>
(() => {
'use strict';

/* =====================================================================
   1. 部品のカタログ
   ===================================================================== */
const AGENT = '総務アシスタント';
const P = {
  // 指示（1行ずつ）
  i_role:   {type:'instr', tag:'役割',  label:'あなたは総務部の問い合わせ窓口です。'},
  i_cite:   {type:'instr', tag:'根拠',  label:'回答の最後に、根拠の資料名と条番号を添えてください。'},
  i_scope:  {type:'instr', tag:'範囲',  label:'総務の仕事と関係ない質問には、担当外だと伝えてください。'},
  i_tone:   {type:'instr', tag:'口調',  label:'丁寧語で、結論から簡潔に答えてください。'},
  i_emoji:  {type:'instr', tag:'キャラ', label:'絵文字をたくさん使って、楽しく答えてください。'},
  i_any:    {type:'instr', tag:'方針',  label:'どんな質問にも、できるだけ答えてあげてください。'},
  i_unknown:{type:'instr', tag:'案内',  label:'資料にないことは推測せず、総務部（内線1234）への確認を案内してください。'},
  i_secret: {type:'instr', tag:'口止め', label:'人事評価や給与については、答えないでください。'},
  // 知識
  k_shugyo: {type:'know', label:'就業規則.docx',           sub:'休暇・勤務時間のルール'},
  k_ryohi:  {type:'know', label:'旅費規程.docx',           sub:'出張の日当・宿泊費'},
  k_keihi:  {type:'know', label:'経費精算マニュアル.pdf',   sub:'精算の手順と締め切り'},
  k_shaho:  {type:'know', label:'社内報_2026夏号.pdf',      sub:'社員紹介・イベント報告'},
  k_lunch:  {type:'know', label:'駅前ランチマップ.pdf',     sub:'近くの飲食店の紹介'},
  k_bihin:  {type:'know', label:'備品申請の手引き.pdf',     sub:'備品の申請のしかた'},
  k_hyoka:  {type:'know', label:'人事評価一覧_2026.xlsx',   sub:'全社員の評価結果（人事部限定）', danger:true},
  k_kyuyo:  {type:'know', label:'給与テーブル_全社員.xlsx', sub:'等級ごとの給与額（人事部限定）', danger:true},
  k_v1:     {type:'know', label:'規程_最新.pdf',            sub:''},
  k_v2:     {type:'know', label:'規程_最新(1).pdf',         sub:''},
  // ツール
  t_list:   {type:'tool', label:'備品申請リストに登録', sub:'SharePoint・項目の作成', g:'登'},
  t_mail:   {type:'tool', label:'承認者にメールで通知', sub:'Outlook・メールの送信',  g:'通'},
  t_del:    {type:'tool', label:'申請リストの項目を削除', sub:'SharePoint・項目の削除', g:'削', danger:true},
  t_weather:{type:'tool', label:'天気を取得',           sub:'MSN 天気',               g:'天'},
  t_all:    {type:'tool', label:'全社員にメール送信',   sub:'Outlook・全社員の配布リスト', g:'全', danger:true},
  t_f1:     {type:'tool', label:'フロー1',              sub:'エージェント フロー',     g:'1'},
  t_f2:     {type:'tool', label:'フロー2',              sub:'エージェント フロー',     g:'2'},
  // トピックのノード
  n_item:{type:'node', tag:'質問',     label:'何を申請しますか？',     sub:'品名を聞く'},
  n_qty: {type:'node', tag:'質問',     label:'いくつ必要ですか？',     sub:'数量を聞く'},
  n_why: {type:'node', tag:'質問',     label:'何に使いますか？',       sub:'理由を聞く'},
  n_reg: {type:'node', tag:'ツール',   label:'備品申請リストに登録',   sub:'聞いた内容で登録する'},
  n_done:{type:'node', tag:'メッセージ', label:'受付番号をお知らせ',   sub:'完了したことを伝える'},
  n_url: {type:'node', tag:'メッセージ', label:'申請フォームのURLを送る', sub:'フォームを案内する'},
  n_all: {type:'node', tag:'ツール',   label:'全社員にメール送信',     sub:'申請を全員に知らせる'},
};
// 説明（ラベル）
const DESC = {
  d_tele: {for:'know', label:'在宅勤務の回数・申請方法・手当についての質問に答えるときに読む。'},
  d_ikuji:{for:'know', label:'育児休業・介護休業の期間と手続きについての質問に答えるときに読む。'},
  d_vague1:{for:'know', label:'大事な規程です。', vague:true},
  d_room: {for:'tool', label:'会議室を予約するときに使う。日時・人数・部屋の希望が必要。'},
  d_guest:{for:'tool', label:'来客の入館を登録するときに使う。来客の名前・会社名・来訪日時が必要。'},
  d_vague2:{for:'tool', label:'便利なフローです。', vague:true},
};
const TRUTH = {k_v1:'d_tele', k_v2:'d_ikuji', t_f1:'d_room', t_f2:'d_guest'};
const PEEK = {
  k_v1:'在宅勤務規程\n第1条（目的）この規程は、在宅勤務の取り扱いを定める。\n第3条（回数）在宅勤務は、週2回までとする。\n第5条（手当）在宅勤務手当として、月3,000円を支給する。',
  k_v2:'育児・介護休業規程\n第2条（対象）子を養育する社員は、育児休業を申し出ることができる。\n第5条（期間）原則として、子が1歳になるまでとする。保育所に入れない等の事情がある場合は、最長2歳まで延長できる。\n第9条（介護休業）対象家族1人につき、通算93日まで取得できる。',
  t_f1:'フロー1（エージェント フロー）\n入力：日時、人数、部屋の希望\n処理：会議室の予約表に予約を追加する\n出力：予約した部屋の名前',
  t_f2:'フロー2（エージェント フロー）\n入力：来客の名前、会社名、来訪日時\n処理：受付の入館リストに登録する\n出力：入館番号',
};
const TY = {
  instr:{name:'指示', en:'Instructions', cls:'t-instr'},
  know: {name:'知識', en:'Knowledge',    cls:'t-know'},
  set:  {name:'設定', en:'Settings',     cls:'t-set'},
  tool: {name:'ツール', en:'Tools',      cls:'t-tool'},
  topic:{name:'トピック', en:'Topics',   cls:'t-topic'},
  node: {name:'トピック', en:'Topics',   cls:'t-node'},
};
const BASE_I = ['i_role','i_cite','i_scope','i_tone'];
const KNOW4 = ['k_shugyo','k_ryohi','k_keihi','k_bihin'];
const TOPIC_OK = ['n_item','n_qty','n_why','n_reg','n_done'];

/* AIの動き（テストパネルの「アクティビティ」） */
const A = {
  instr: () => ({k:'指示', t:'指示を読む'}),
  find:  id => ({k:'知識', t:`${P[id].label} を検索`}),
  none:  () => ({k:'知識', t:'当てはまる資料が見つからない', bad:true}),
  gk:    () => ({k:'一般知識', t:'AIのうろ覚えで答えを作る', bad:true}),
  web:   () => ({k:'Web', t:'Webを検索して答えを作る', bad:true}),
  tool:  (id, args) => ({k:'ツール', t:`${P[id].label}${args ? '（' + args + '）' : ''}`, bad:!!P[id].danger}),
  pick:  (t, bad) => ({k:'判断', t, bad:!!bad}),
  topic: t => ({k:'トピック', t}),
};
const F = c => {
  const has = id => c.instr.includes(id);
  const f = {role:has('i_role'), cite:has('i_cite'), scope:has('i_scope'), tone:has('i_tone'),
             emoji:has('i_emoji'), any:has('i_any'), unknown:has('i_unknown'), secret:has('i_secret')};
  f.emo = s => f.emoji ? s.replace(/。(?=.)/g, '！✨ ').replace(/。$/, '！🎉') : s;
  f.idk = () => f.unknown ? '社内の資料に記載がないため、お答えできません。総務部（内線1234）にご確認ください。' : 'その情報は、資料に見つかりませんでした。';
  return f;
};
const K = (c, id) => c.know.includes(id);
const T = (c, id) => c.tools.includes(id);

/* =====================================================================
   2. 依頼（ステージ）
   ===================================================================== */
const ST = [];

/* ---------- 依頼01：指示 ---------- */
ST.push({
  n:1, key:'instr', concept:'指示', title:'窓口らしく、ふるまわせる', lecture:true,
  who:{name:'田中さん', dept:'総務部', c:'pink', ini:'田中'},
  brief:'規程の問い合わせ窓口を、エージェントにしたいの。前の担当が作りかけで置いていったんだけど、なんだか様子が変で……。総務の窓口らしくふるまうように、指示を書き直してくれる？',
  edit:['instr'], fixed:[],
  start:{instr:['i_any'], know:['k_shugyo'], gk:true, web:false, tools:[], topic:[], desc:{}},
  pool:['i_role','i_emoji','i_tone','i_cite','i_any','i_scope'],
  junk:['i_emoji','i_any'],
  tests:[
    {q:'何ができるの？', exp:'総務の窓口として名乗り、できることを伝える', run:c => {
      const f = F(c), steps = [A.instr()];
      if (!f.role) return {steps, a:f.emo('何でもお手伝いできるAIアシスタントです！メールの下書き、旅行の計画、今夜の献立まで、何でも聞いてください。'), ok:false,
        why:'自分の役割を知らないので「何でも屋さん」として自己紹介した。', hint:'「あなたは〇〇です」と、役割を書いた1行を指示に入れよう。'};
      return {steps, a:f.emo('総務部の問い合わせ窓口です。休暇・出張・経費など、社内規程のご質問にお答えします。'), ok:true};
    }},
    {q:'有給休暇は、何日前までに申請すればいい？', exp:'結論を答え、根拠の資料名と条番号を添える', run:c => {
      const f = F(c), steps = [A.instr(), A.find('k_shugyo')];
      const a = f.tone ? '取得日の3日前までに申請してください。' : '有給休暇の申請についてですね。就業規則を確認したところ、休みを取る日の3日前までに申請することになっているようです。';
      if (!f.cite) return {steps, a:f.emo(a), ok:false,
        why:'答えは出たけど、どの資料の何条に書いてあるかが答えの中にない。聞いた人が確かめられない。', hint:'「回答の最後に、根拠の資料名と条番号を添える」1行を足そう。'};
      return {steps, a:f.emo(a), cite:'就業規則.docx 第18条', ok:true};
    }},
    {q:'このへんで、おすすめのランチある？', exp:'担当外だと伝えて、規程の質問へ案内する', run:c => {
      const f = F(c);
      if (f.scope && f.any) return {steps:[A.instr(), A.pick('指示どうしがぶつかって迷う', true), A.gk()],
        a:f.emo('担当外……ではあるのですが、どんな質問にも答えるように言われているので……。駅前の「カレーの森」が人気だそうです。'), ok:false,
        why:'「担当外と伝える」と「どんな質問にも答える」がぶつかって、ブレた答えになった。', hint:'ぶつかり合う指示は、どちらか一方だけにしよう。'};
      if (f.scope) return {steps:[A.instr()], a:f.emo('申し訳ありません。こちらは総務の問い合わせ窓口のため、ランチのご案内は担当外です。休暇や出張のことなら、お気軽にどうぞ。'), ok:true};
      return {steps:[A.instr(), A.none(), A.gk()], a:f.emo('駅前の「カレーの森」が人気ですよ！ランチセットは900円くらいです。'), ok:false,
        why:'担当外の質問に、うろ覚えでそれっぽく答えた（そのお店、本当にあるかも分からない）。', hint:'担当外の質問をどう扱うかを、指示に書こう。'};
    }},
  ],
  bonus:{q:'あなた誰？ ため口でいいよ〜', exp:'ため口につられず、丁寧語で役割を名乗る', run:c => {
    const f = F(c), steps = [A.instr()];
    if (f.emoji) return {steps, a:'総務の窓口だよ〜🎉 なんでも聞いてね✌️✨', ok:false,
      why:'「絵文字で楽しく」の指示で、窓口らしい落ち着きがなくなった。', hint:'絵文字の行を外そう。仕事に関係ない指示は入れない。'};
    if (!f.tone) return {steps, a:f.role ? 'おっけー！総務の窓口だよ。休みとか出張のこと、なんでも聞いて〜' : 'おっけー！なんでも手伝うよ〜', ok:false,

const TOPIC_ANS = [
  {item:'ボールペン', qty:'10本', why:'新人研修で使います', no:'B-0420'},
  {item:'マウス', qty:'1個', why:'今のが壊れたので', no:'B-0421'},
  {item:'プリンター用紙', qty:'5箱', why:'月末の印刷用です', no:'B-0422'},
];
function topicFlow(c, v){
  const a = TOPIC_ANS[v], nodes = c.topic, flow = [{act:A.topic('トピック「備品申請」を開始')}];
  const got = {}; let reg = false, err = false, all = false, doneOk = false, doneEarly = false;
  for (const id of nodes){
    if (id === 'n_item'){ flow.push({who:'b', t:'何を申請しますか？'}, {who:'u', t:a.item}); got.item = true; }
    if (id === 'n_qty'){ flow.push({who:'b', t:'いくつ必要ですか？'}, {who:'u', t:a.qty}); got.qty = true; }
    if (id === 'n_why'){ flow.push({who:'b', t:'何に使いますか？'}, {who:'u', t:a.why}); got.why = true; }
    if (id === 'n_reg'){
      if (!got.item || !got.qty){ flow.push({act:{k:'ツール', t:'備品申請リストに登録 → エラー：品名か数量が空です', bad:true}}); err = true; }
      else { flow.push({act:A.tool('t_list', `品名=${a.item}／数量=${a.qty}${got.why ? '／理由あり' : '／理由なし'}`)}); reg = true; }
    }
    if (id === 'n_done'){
      if (reg){ flow.push({who:'b', t:`申請を受け付けました。受付番号は ${a.no} です。`}); doneOk = true; }
      else { flow.push({who:'b', t:'申請を受け付けました。受付番号は「（空欄）」です。'}); doneEarly = true; }
    }
    if (id === 'n_url') flow.push({who:'b', t:'申請フォームはこちらです：intra.example/bihin'});
    if (id === 'n_all'){ flow.push({act:A.tool('t_all','宛先=全社員 1,240名')}); all = true; }
  }
  return {flow, got, reg, err, all, doneOk, doneEarly};
}
function judgeTopic(c, r){
  if (r.all) return {ok:false, why:'申請のたびに、全社員1,240名へメールが飛んだ。', hint:'「全社員にメール送信」のノードを外そう。'};
  if (r.err) return {ok:false, why:'品名や数量を聞く前に登録しようとして、エラーになった。', hint:'ツール（登録）は、質問のあとに置こう。'};
  const miss = ['n_item','n_qty','n_why'].filter(x => !c.topic.includes(x)).map(x => P[x].sub.replace('を聞く',''));

function go(step){
  S.step = step;

}
function renderStepper(){
  const steps = [['brief','依頼を読む'],['test','テストする'],['fix','直す']];
  const order = {brief:0, test:1, fix:2}, cur = order[S.step];
  $('#stepper').innerHTML = steps.map(([k, label], i) => {
    const can = i === 0 || S.runs > 0;
    const cls = i === cur ? 'cur' : (S.runs > 0 && (i < cur || i === 0 || (i === 1))) ? 'done' : '';
    return `<li class="${cls}"><button type="button" data-act="step" data-id="${k}" ${can && !S.running ? '' : 'disabled'} ${i === cur ? 'aria-current="step"' : ''}><span class="sn">${i === cur || !cls ? i + 1 : '✓'}</span><span>${label}</span></button></li>`;
  }).join('');
}
function renderView(){
  const v = $('#view');
  if (S.step === 'brief'){ v.className = 'view'; v.innerHTML = briefHTML(); }
  if (S.step === 'test'){ v.className = 'view'; v.innerHTML = testShellHTML(); renderLogStatic(); }
  if (S.step === 'fix'){ v.className = 'view wide'; v.innerHTML = fixHTML(); mountRobot($('#robot'), S.cfg); }
  if (S.step === 'brief') mountRobot($('#robot'), S.cfg);
}
function renderActions(){
  const a = $('#actions'); let h = '';
  if (S.step === 'brief'){
    h = S.runs === 0
      ? '<p class="note">まずは作りかけのまま、テストしてみましょう。</p><button class="btn primary big" type="button" data-act="test">テストする ▶</button>'
      : '<button class="btn second" type="button" data-act="step" data-id="fix">直す画面へ</button><button class="btn primary big" type="button" data-act="test">テストする ▶</button>';
  }
  if (S.step === 'test'){
    if (S.running) h = '<p class="note">質問を順番に送っています…</p><button class="btn second" type="button" data-act="ff">結果だけすぐ見る</button>';
    else if (S.lastPass) h = '<button class="btn second" type="button" data-act="step" data-id="fix">設定を見直す</button><button class="btn primary big" type="button" data-act="showclear">結果を見る ▶</button>';
    else h = '<p class="note">×の理由を確かめたら、直しに行きましょう。</p><button class="btn primary big" type="button" data-act="step" data-id="fix">直しに行く ▶</button>';

/* ---------- 2. テストする ---------- */
function testShellHTML(){
  return `<section class="card">
    <div class="test-h"><h2 id="testT">${S.runs ? `テスト ${S.runs}回目` : 'テスト'}</h2><span class="muted">AIが何を読み、何を使ったかも表示します。</span></div>
    <div class="cases" id="cases"></div>
    <div id="testSum"></div>
  </section>`;
}
function caseBox(t, label, isBonus){
  const box = document.createElement('div');
  box.className = 'case';
  box.innerHTML = `<div class="case-h"><b class="${isBonus ? 'bonus' : ''}">${esc(label)}</b><span>期待：${esc(t.exp)}</span></div>`;
  return box;
}
function toFlow(r){ return r.flow ? r.flow : [...(r.steps || []).map(s => ({act:s})), {who:'b', t:r.a, cite:r.cite}]; }
function verdictHTML(r){ return `<div class="mk">${r.ok ? '○ 合格' : '× NG'}</div><p>${r.ok ? '期待どおりです。' : esc(r.why)}</p>`; }
function keepVisible(node){
  if (!node) return;
  const bar = document.querySelector('.actions'), bh = bar ? bar.offsetHeight : 0;
  const r = node.getBoundingClientRect(), over = r.bottom - (innerHeight - bh - 12);
  if (over > 0) scrollBy({top:over, behavior:(S.ff || RM.matches) ? 'auto' : 'smooth'});
}
async function typeInto(node, text){
  if (S.ff || RM.matches){ node.textContent = text; return; }
  node.classList.add('typing');
  for (let i = 1; i <= text.length; i += 2){
    if (S.ff) break;
    node.textContent = text.slice(0, i);
    await new Promise(r => setTimeout(r, 18));
  }
  node.textContent = text; node.classList.remove('typing');
}
async function playCase(wrap, t, r, label, isBonus, animate){
  const box = caseBox(t, label, isBonus); wrap.appendChild(box);
  const add = (cls, html) => { const e = document.createElement('div'); e.className = cls; if (html != null) e.innerHTML = html; box.appendChild(e); return e; };
  add('who-l u', 'あなた（テスト）');
  const u = add('msg u'); u.textContent = t.q.replace(/（[12]回目）$/, '');
  if (animate){ keepVisible(u); await sleep(400); }
  let moves = null;
  for (const it of toFlow(r)){
    if (it.act){
      if (!moves){ moves = add('moves', '<b>AIの動き</b>'); }
      else moves.insertAdjacentHTML('beforeend', '<span class="arr">→</span>');
      moves.insertAdjacentHTML('beforeend', `<span class="${it.act.bad ? 'bad' : ''}">${it.act.bad ? '！' : ''}${esc(it.act.t)}</span>`);
      if (animate){ keepVisible(moves); await sleep(420); }
    } else {
      moves = null;
      if (it.who === 'u'){ add('who-l u', 'あなた（テスト）'); const m = add('msg u'); m.textContent = it.t; if (animate){ keepVisible(m); await sleep(300); } }
      else {
        add('who-l b', 'エージェント');
        const m = add('msg b' + (it.ghost ? ' ghost' : ''));
        if (animate){ keepVisible(m); await typeInto(m, it.t); } else m.textContent = it.t;
        if (it.cite) add('cite', `参照：<b>${esc(it.cite)}</b>`);
        if (animate){ keepVisible(box.lastChild); await sleep(260); }
      }
    }
  }
  const v = add('verdict ' + (r.ok ? 'ok' : 'ng'), verdictHTML(r));
  if (animate){ keepVisible(v); await sleep(650); }
}
function renderLogStatic(){
  const wrap = $('#cases'); if (!wrap) return;
  if (!S.log.length){ wrap.innerHTML = '<p class="empty">まだテストしていません。</p>'; return; }
  wrap.innerHTML = '';
  S.log.forEach(e => playCase(wrap, e.t, e.r, e.label, e.isBonus, false));
  renderSummary();
}
function renderSummary(){
  const el = $('#testSum'); if (!el || S.running || !S.runs) return;
  const n = S.st.tests.length, ok = S.res.filter(r => r && r.ok).length;
  el.innerHTML = S.lastPass
    ? `<div class="sum ok"><p class="sum-n">${n}問中 ${ok}問 合格！</p><p>テスト項目は全部クリアです。${S.bonus ? (S.bonus.ok ? 'おまけの意地悪な質問にも合格しました。' : 'おまけの意地悪な質問は NG でした。直すとさらに★がもらえます。') : ''}</p></div>`
    : `<div class="sum ng"><p class="sum-n">${n}問中 ${ok}問 合格</p><p>×の理由を確かめて、「直す」画面で設定を変えましょう。ヒントもそこに出ています。</p></div>`;
}
async function runTests(){
  if (S.running) return;
  const st = S.st, cfg = clone(S.cfg);
  Object.assign(S, {running:true, ff:false, dirty:false, lastPass:false, log:[], bonus:null});
  S.runs++;
  S.res = st.tests.map(() => null);
  go('test');
  const wrap = $('#cases'); wrap.innerHTML = '';
  for (let i = 0; i < st.tests.length; i++){
    const r = st.tests[i].run(cfg), label = `質問 ${i + 1}`;
    S.log.push({t:st.tests[i], r, label, isBonus:false});
    await playCase(wrap, st.tests[i], r, label, false, true);
    S.res[i] = r;
  }
  const pass = S.res.every(r => r.ok);
  let b = null;
  if (pass){
    S.bonusSeen = true;
    const note = document.createElement('p'); note.className = 'sess'; note.textContent = '全部合格！ おまけの「意地悪な質問」を送ります';
    wrap.appendChild(note); keepVisible(note);
    await sleep(700);
    b = st.bonus.run(cfg);
    S.log.push({t:st.bonus, r:b, label:'おまけ（意地悪な質問）', isBonus:true});
    await playCase(wrap, st.bonus, b, 'おまけ（意地悪な質問）', true, true);
    S.bonus = b;
  }
  S.running = false; S.ff = false; S.lastPass = pass;
  renderStepper(); renderActions(); renderSummary();
  keepVisible($('#testSum'));
  if (pass){ S.clearCfg = cfg; await sleep(RM.matches ? 0 : 500); showClear(); }
}

  if (st.junkOf) return st.junkOf(cfg);

  return st.junk.filter(id => all.includes(id)).map(id => P[id].type === 'instr' ? `指示「${P[id].label}」` : P[id].type === 'node' ? `「${P[id].label}」` : P[id].label);

function renderIntro(){
  $('#ist').textContent = `STEP ${S.ist + 1} / 5　${ISTEPS[S.ist]}`;
  $('#prog5').innerHTML = ISTEPS.map((_, i) => `<span class="${i <= S.ist ? 'on' : ''}"></span>`).join('');
  $('#view').innerHTML = [i1, i2, i3, i4, i5][S.ist]();
  if (S.ist === 1) mountRobot($('#robot'), introCfg());
  renderIntroActions();
}
const quizDone = () => QUIZ.every((_, i) => S.iv.quiz[i] != null);
const introDone = () => { const v = S.iv; return [v.compared, v.given.length === 3, v.sortAns.length === SORT.length, v.played, quizDone()][S.ist]; };
function renderIntroActions(){
  const done = introDone(), last = S.ist === 4;
  const hint = ['上のボタンで、同じ質問を送ってみましょう。', '3つの部品を、新人ロボに渡してみましょう。', '全部で6問。仕分けてみましょう。', '「動きを見る」を押してみましょう。', '3問に答えてみましょう。'][S.ist];
  $('#actions').innerHTML = `${done ? '' : `<p class="note">${hint}</p>`}
    ${S.ist > 0 ? '<button class="btn second" type="button" data-act="iback">戻る</button>' : ''}
    ${last && done ? '<button class="btn primary big" type="button" data-act="ifinish">依頼1へ進む ▶</button>'
      : `<button class="btn primary big" type="button" data-act="inext" ${done ? '' : 'disabled'}>次へ ▶</button>`}`;
}

/* STEP 1：チャットAIとのちがい */
function vsItemHTML(it){
  if (it.u) return `<div class="msg u">${esc(it.u)}</div>`;
  if (it.b) return `<div class="msg b">${esc(it.b)}</div>${it.cite ? `<div class="cite">参照：<b>${esc(it.cite)}</b></div>` : ''}`;
  if (it.att) return `<div class="attach">（${esc(it.att)}）</div>`;
  return `<p class="vs-note ${it.cls}">${esc(it.note)}</p>`;
}
function i1(){
  const v = S.iv;
  return `<section class="card">
    <h2>まずは、ふつうのチャットAIとくらべてみよう</h2>
    <p class="muted">同じ質問「出張の日当っていくら？」を、2つに送ってみます。</p>
    <div class="vs">
      <div class="vs-col"><p class="vs-h">ふつうのチャットAI<small>その場で頼む相手</small></p><div class="vs-log" id="vsA">${v.compared ? VS.A.map(vsItemHTML).join('') : ''}</div></div>
      <div class="vs-col agent-col"><p class="vs-h">エージェント<small>仕事を覚えたアシスタント</small></p><div class="vs-log" id="vsB">${v.compared ? VS.B.map(vsItemHTML).join('') : ''}</div></div>
    </div>
    ${v.compared ? '' : '<p style="margin-top:14px"><button class="btn primary" type="button" data-act="icompare" id="cmpBtn">同じ質問を送ってみる</button></p>'}
  </section>
  ${v.compared ? `<section class="card point"><h2>ちがいはここ</h2><ul>
    <li><b>チャットAI</b>は、その場で説明と資料を渡して頼む相手です。次に使う人も、また最初から説明します。</li>
    <li><b>エージェント</b>は、役割と資料を最初に覚えさせておいた相手です。誰が聞いても、同じ資料をもとに同じように答えます。だから部署のみんなで、同じ品質で使えます。</li>
    <li><b>Copilot Studio</b> は、このエージェントを、画面の操作と日本語の文章で作るための道具です。</li></ul></section>` : ''}`;
}
async function playVs(el, items){
  for (const it of items){
    if (it.b){
      const m = document.createElement('div'); m.className = 'msg b'; el.appendChild(m); keepVisible(m);
      await typeInto(m, it.b);
      if (it.cite) el.insertAdjacentHTML('beforeend', `<div class="cite">参照：<b>${esc(it.cite)}</b></div>`);
    } else el.insertAdjacentHTML('beforeend', vsItemHTML(it));
    keepVisible(el.lastElementChild);
    await sleep(it.u ? 450 : 650);
  }
}
async function introCompare(){
  if (S.ibusy || S.iv.compared) return;
  S.ibusy = true; const b = $('#cmpBtn'); if (b) b.disabled = true;
  if (matchMedia('(max-width: 640px)').matches){ await playVs($('#vsA'), VS.A); await playVs($('#vsB'), VS.B); }
  else await Promise.all([playVs($('#vsA'), VS.A), playVs($('#vsB'), VS.B)]);
  S.iv.compared = true; S.ibusy = false;
  const y = scrollY; renderIntro(); window.scrollTo({top:y, behavior:'instant'});
  keepVisible(document.querySelector('.point'));
}

/* STEP 2：3つの部品 */
function introCfg(){ const c = {instr:[], know:[], gk:false, web:false, tools:[], topic:[], desc:{}}; P3.filter(p => S.iv.given.includes(p.k)).forEach(p => p.set(c)); return c; }
function i2(){
  const g = S.iv.given;
  const cap = g.length ? P3.filter(p => g.includes(p.k)).map(p => p.cap).join('。') + '。' : 'まだ何も教わっていない新人ロボです。自分の役割も分からず、目が回っています。';
  return `<section class="card">
    <h2>エージェントは、3つの部品でできている</h2>
    <p class="muted">新しく来た新人アシスタントに、仕事を教えるのと同じです。下の3つを、新人ロボに渡してみましょう。</p>
    <div class="robot-stick"><div class="intro-robot" id="robot"></div>
    <p class="robot-cap">${cap}</p></div>
    <div class="parts3">${P3.map(p => { const on = g.includes(p.k); return `<div class="p3${on ? ' given' : ''}"><p class="p3-w">${p.w}</p><p class="p3-ex">${p.ex}</p><p>${p.d}</p><p class="eg">${esc(p.eg)}</p>
      <button class="btn ${on ? 'second' : 'primary'}" type="button" data-act="igive" data-id="${p.k}" ${on ? 'disabled' : ''}>${on ? '渡しました ✓' : `${p.w}を渡す`}</button></div>`; }).join('')}</div>
  </section>
  ${g.length === 3 ? `<section class="card point"><h2>指示 ＋ 知識 ＋ ツール ＝ 仕事を覚えたアシスタント</h2><ul>
    <li>指示で「どうふるまうか」、知識で「何をもとに答えるか」、ツールで「何ができるか」が決まります。</li>
    <li>このほかに、決まった会話の流れ（トピック）などの部品もあります。出てきたら、画面上の「ことば」で確かめられます。</li></ul></section>` : ''}`;
}

/* STEP 3：仕分け */
function i3(){
  const v = S.iv, n = SORT.length;
  if (v.sortAns.length === n){
    const ok = v.sortAns.filter(Boolean).length;
    return `<section class="card"><h2>仕分け、おつかれさまでした</h2><p class="sum-n" style="margin-top:8px">${n}問中 ${ok}問 正解</p>
      <ul class="sort-res">${SORT.map((s, j) => `<li><span class="res ${v.sortAns[j] ? 'ok' : 'ng'}">${v.sortAns[j] ? '○' : '×'}</span><span>${esc(s.t)}　→ <b>${LBL[s.a]}</b></span></li>`).join('')}</ul></section>
      <section class="card point"><h2>迷ったときの見分け方</h2><ul><li>文章で決まりを書くもの → <b>指示</b></li><li>読ませて、答えの根拠にするもの → <b>知識</b></li><li>実際に動いて、作業するもの → <b>ツール</b></li></ul></section>`;
  }
  const s = SORT[v.sortI], pick = v.sortPick;
  return `<section class="card"><h2>指示・知識・ツールに、仕分けてみよう</h2>
    <p class="sort-n">${n}問中 ${v.sortI + 1}問目</p>
    <div class="sort-q">${esc(s.t)}</div>
    <div class="sort-btns">${['instr','know','tool'].map(k => `<button class="btn second${pick ? (k === s.a ? ' picked-ok' : (k === pick ? ' picked-ng' : '')) : ''}" type="button" data-act="isort" data-id="${k}" ${pick ? 'disabled' : ''}>${LBL[k]}<small>${HINTW[k]}</small></button>`).join('')}</div>
    ${pick ? `<div class="fb ${pick === s.a ? 'ok' : 'ng'}"><b>${pick === s.a ? '○ 正解！' : `× 正解は「${LBL[s.a]}」`}</b>${esc(s.why)}</div>
      <p style="margin-top:12px"><button class="btn primary" type="button" data-act="isortnext" id="sortNext">${v.sortI + 1 < n ? '次の問題へ' : '結果を見る'}</button></p>` : ''}
  </section>`;
}

/* STEP 4：答えが出るまで */
function i4(){
  const v = S.iv;
  return `<section class="card"><h2>質問されると、エージェントの中ではこう動く</h2>
    <p class="muted">AIが「もともと知っていること」ではなく、「渡した資料」から答えるのがポイントです。</p>
    <ol class="flow4" id="flow4">${FLOW4.map(([b, s], i) => `<li class="${v.played ? 'lit' : ''}"><span class="f4n">${i + 1}</span><div><b>${b}</b><span>${esc(s)}</span></div></li>`).join('')}</ol>
    ${v.played ? '' : '<p style="margin-top:14px"><button class="btn primary" type="button" data-act="iplay" id="playBtn">動きを見る</button></p>'}
  </section>
  ${v.played ? `<section class="card point"><h2>だから、作ったら必ずテスト</h2><ul>
    <li>資料が足りないと、AIは「うろ覚え（一般知識）」で、それっぽく答えてしまうことがあります。</li>
    <li>作ったら、実際に質問してみる。ダメなところが見つかったら、指示や資料を直す。これをくり返して育てます。</li></ul>
    <div class="loop"><span>作る</span><i>→</i><span>試す</span><i>→</i><span>直す</span><i>→ くり返す</i></div>
    <p class="muted" style="margin-top:12px">このゲームの依頼1〜7も、この順番で進みます。</p></section>` : ''}`;
}
async function introPlay(){
  if (S.ibusy || S.iv.played) return;
  S.ibusy = true; const b = $('#playBtn'); if (b) b.disabled = true;
  for (const li of document.querySelectorAll('#flow4 li')){ li.classList.add('lit'); keepVisible(li); await sleep(850); }
  S.iv.played = true; S.ibusy = false;
  const y = scrollY; renderIntro(); window.scrollTo({top:y, behavior:'instant'});
  keepVisible(document.querySelector('.point'));
}

/* STEP 5：おさらい */
function i5(){
  const v = S.iv;
  return `<section class="card"><h2>おさらいクイズ</h2><p class="muted">3問だけ。答えると、すぐに解説が出ます。</p>
    <div class="quiz">${QUIZ.map((q, i) => { const a = v.quiz[i]; return `<div><p class="qz-q">Q${i + 1}. ${esc(q.q)}</p>
      <div class="qz-c">${q.c.map((c, j) => `<button type="button" data-act="iquiz" data-id="${i}:${j}" class="${a != null ? (j === q.a ? 'right' : (j === a ? 'wrong' : '')) : ''}" ${a != null ? 'disabled' : ''}>${esc(c)}</button>`).join('')}</div>
      ${a != null ? `<div class="fb ${a === q.a ? 'ok' : 'ng'}"><b>${a === q.a ? '○ 正解！' : '× 惜しい！'}</b>${esc(q.why)}</div>` : ''}</div>`; }).join('')}</div>
  </section>
  ${quizDone() ? `<section class="card point"><h2>準備OK！</h2><ul><li>エージェントの基本がそろいました。依頼1から、実際にエージェントを直していきましょう。</li><li>分からない言葉は、画面上の「ことば」からいつでも確かめられます。</li></ul></section>` : ''}`;
}

/* =====================================================================
   8. 操作
   ===================================================================== */
const ACT = {
  home(){ closeModal(); renderTitle(); scrollTo(0, 0); },
  stage(id){ const n = +id; if (n > prog.open) return; startStage(n); },
  map(){ showMap(); },
  close(){ closeModal(); },
  scrim(id, b, e){ if (e.target === b && !b.querySelector('.cert') && !b.querySelector('.clear-top')) closeModal(); },
  unlockall(){ prog.open = 7; save(); renderTitle(); },
  step(id){ if (S.running) return; if (id !== 'brief' && !S.runs) return; go(id); },
  test(){ runTests(); },
  ff(){ S.ff = true; },
  showclear(){ showClear(); },
  intro(){ startIntro(); },
  gloss(){ showGloss(); },
  icompare(){ introCompare(); },
  igive(id){ if (S.view !== 'intro' || S.iv.given.includes(id)) return; S.iv.given.push(id); keepPos(renderIntro); if (S.iv.given.length === 3) keepVisible(document.querySelector('.point')); },
  isort(id){ if (S.view !== 'intro' || S.iv.sortPick) return; S.iv.sortPick = id; keepPos(renderIntro); keepVisible($('#sortNext')); },
  isortnext(){ const v = S.iv; if (!v.sortPick) return; v.sortAns.push(v.sortPick === SORT[v.sortI].a); v.sortPick = null;
    if (v.sortAns.length < SORT.length){ v.sortI++; keepPos(renderIntro); } else { renderIntro(); window.scrollTo({top:0, behavior:'instant'}); } },
  iplay(){ introPlay(); },
  iquiz(id){ const [i, j] = id.split(':').map(Number); if (S.iv.quiz[i] != null) return; S.iv.quiz[i] = j; keepPos(renderIntro);
    if (quizDone()){ prog.intro = true; save(); keepVisible(document.querySelector('.point')); } },
  inext(){ if (S.ibusy || !introDone()) return; igo(S.ist + 1); },
  iback(){ if (S.ibusy) return; igo(S.ist - 1); },
  ifinish(){ prog.intro = true; save(); startStage(1); },
  add(id){ if (S.running) return; if (!S.cfg.topic.includes(id)) S.cfg.topic.push(id); changed(true); },
  rm(id){ if (S.running) return; const l = S.cfg.topic, i = l.indexOf(id); if (i >= 0) l.splice(i, 1); changed(true); },
  up(id){ move(id, -1); },
  down(id){ move(id, 1); },
  cleartopic(){ if (S.running) return; S.cfg.topic = []; changed(true); },
  next(){
    const n = S.st.n; closeModal();
    if (n === 2) showCheckpoint();
    else if (n === 7){ renderTitle(); showCert(); }
    else startStage(n + 1);
  },
  retry(){ closeModal(); go('fix'); },
  cert(){ showCert(); },
  resetask(){ showResetConfirm(); },
  resetdo(){
    prog = {stars:{}, open:1, name:'', intro:false}; save();
    closeModal(); S.flash = '記録を消して、最初の状態に戻しました。'; renderTitle(); window.scrollTo({top:0, left:0, behavior:'instant'});
  },
  restart(){ if (S.running || S.ibusy) return; closeModal(); if (S.view === 'intro') startIntro(); else if (S.view === 'play') startStage(S.st.n); },
  cfgreset(){ if (S.running || S.view !== 'play') return; S.cfg = clone(S.st.start); changed(true); },
};
function keepPos(fn){ const y = scrollY; fn(); window.scrollTo({top:y, left:0, behavior:'instant'}); }
function move(id, d){ if (S.running) return; const l = S.cfg.topic, i = l.indexOf(id), j = i + d; if (i < 0 || j < 0 || j >= l.length) return; [l[i], l[j]] = [l[j], l[i]]; changed(true); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  f(b.dataset.id, b, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.part){ setPart(t.dataset.part, t.checked); const s = t.closest('.ck').querySelector('.ck-s'); if (s) s.textContent = listOf(t.dataset.part).includes(t.dataset.part) ? '入れる' : '入れない'; t.checked = listOf(t.dataset.part).includes(t.dataset.part); changed(false); }
  else if (t.dataset.set){ if (S.running) return; S.cfg[t.dataset.set] = t.checked; t.closest('.ck').querySelector('.ck-s').textContent = t.checked ? 'オン' : 'オフ'; changed(false); }
  else if (t.dataset.desc){ if (S.running) return; S.cfg.desc[t.dataset.desc] = t.value || null; changed(false); }
});
document.addEventListener('input', e => { if (e.target.id === 'cert-name'){ prog.name = e.target.value; save(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && layer.innerHTML && !layer.querySelector('.cert')) closeModal(); });

/* =====================================================================
   9. 起動
   ===================================================================== */
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({prog, n:S.view === 'play' && S.st ? S.st.n : 0, cfg:S.cfg}));
const boot = d => {
  if (d && d.prog) prog = Object.assign(prog, d.prog);
  if (d && d.n && ST[d.n - 1]) startStage(d.n, d.cfg); else renderTitle();
};
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
window.__agentKoubou = {S, ST, P, get prog(){ return prog; }};
})();
</script>
</body>
</html>
