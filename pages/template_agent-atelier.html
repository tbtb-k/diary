<title>エージェント工房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1:wght@400;500;700&family=Archivo:wght@600;800&display=swap">
<style>
/* ============================================================
   リソグラフ配色：明るい面＝刷り上がり、暗い面＝夜版
   ============================================================ */
:root{
  color-scheme: light;
  --paper:#ece9e0;
  --paper-2:#e2ded2;
  --ink:#111634;
  --ink-2:#4a4f6b;
  --blue:#1a34a0;
  --pink:#ff3d8b;
  --yellow:#ffc61a;
  --green:#00a95c;
  --band-bg:#1a34a0; --band-fg:#ffffff;   /* インクをベタで敷く面 */
  --line:#111634;
  --blend:multiply;
  --dot:rgba(26,52,160,.30);
  --sp:0px;            /* 版ズレ量（スクロール速度で変動） */
  --f-disp:"Dela Gothic One","M PLUS 1",system-ui,sans-serif;
  --f-body:"M PLUS 1",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Archivo","M PLUS 1",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#141d4a; --paper-2:#1b2660;
    --ink:#f2efe6; --ink-2:#a9b0d8;
    --blue:#6f8cff; --pink:#ff5c9c; --yellow:#ffc61a; --green:#3ad18d;
    --band-bg:#2b3c9e; --band-fg:#f2efe6;
    --line:#f2efe6; --blend:screen; --dot:rgba(255,92,156,.34);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#141d4a; --paper-2:#1b2660;
  --ink:#f2efe6; --ink-2:#a9b0d8;
  --blue:#6f8cff; --pink:#ff5c9c; --yellow:#ffc61a; --green:#3ad18d;
  --band-bg:#2b3c9e; --band-fg:#f2efe6;
  --line:#f2efe6; --blend:screen; --dot:rgba(255,92,156,.34);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:15.5px; line-height:1.95;
  overflow-x:clip; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-family:var(--f-disp); font-weight:400; line-height:1.14; text-wrap:balance; letter-spacing:.005em}
p{margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--pink); outline-offset:3px}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important}
}

.wrap{width:min(1200px,100%); margin-inline:auto; padding-inline:clamp(18px,5vw,56px)}

/* ---- スクロール進捗（インクのにじみ） ---- */
.prog{position:fixed; left:0; top:env(safe-area-inset-top,0px); height:5px; background:var(--pink); z-index:80; width:0; mix-blend-mode:var(--blend)}

/* ---- ヒーロー ---- */
.hero{position:relative; padding-block:clamp(56px,10vw,120px) clamp(40px,7vw,90px); overflow:clip}
#dots{position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
.hero .wrap{position:relative; z-index:1}
.eyebrow{
  display:inline-flex; align-items:center; gap:10px; font-family:var(--f-num); font-weight:800;
  font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:#111634;
  border:2px solid var(--line); padding:5px 13px; background:var(--yellow);
}

/* 版ズレタイトル */
.riso{position:relative; display:inline-block; margin-top:22px}
.riso .l{display:block; font-size:clamp(2.9rem,12.6vw,8.2rem); line-height:.98; letter-spacing:-.015em}
.riso .p1,.riso .p2{position:absolute; inset:0; mix-blend-mode:var(--blend); pointer-events:none}
.riso .p1{color:var(--pink); animation:reg1 1s cubic-bezier(.16,1,.3,1) both}
.riso .p2{color:var(--blue); animation:reg2 1s cubic-bezier(.16,1,.3,1) both}
.riso .p0{color:var(--ink); position:relative}
@keyframes reg1{0%{transform:translate(-.085em,.042em) rotate(-.7deg)} 100%{transform:translate(calc(var(--sp) * -1),0)}}
@keyframes reg2{0%{transform:translate(.075em,-.038em) rotate(.6deg)} 100%{transform:translate(var(--sp),0)}}

.lead{margin-top:26px; max-width:34em; font-size:clamp(1rem,2.5vw,1.2rem); line-height:2.05; color:var(--ink)}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:24px}
.chip{
  font-family:var(--f-num); font-size:12px; font-weight:600; letter-spacing:.06em;
  border:2px solid var(--line); padding:3px 11px; background:transparent;
}
.cta-row{display:flex; flex-wrap:wrap; gap:14px; margin-top:34px}
.btn{
  position:relative; display:inline-block; font-family:var(--f-disp); font-size:clamp(.95rem,2.2vw,1.1rem);
  padding:15px 30px; border:3px solid var(--line); background:var(--pink); color:#fff;
  text-decoration:none; cursor:pointer; transition:transform .16s cubic-bezier(.2,.9,.3,1.3), box-shadow .16s;
  box-shadow:7px 7px 0 var(--line);
}
.btn:hover{transform:translate(-3px,-3px); box-shadow:11px 11px 0 var(--line)}
.btn:active{transform:translate(4px,4px); box-shadow:1px 1px 0 var(--line)}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:7px 7px 0 var(--blue)}
.btn.ghost:hover{box-shadow:11px 11px 0 var(--blue)}

/* ---- 流れる帯 ---- */
.band{
  border-block:3px solid var(--line); background:var(--band-bg); color:var(--band-fg);
  overflow:hidden; transform:rotate(-1.2deg) scale(1.04); margin-block:clamp(30px,6vw,64px);
}
.band-track{display:flex; width:max-content; animation:slide 26s linear infinite}
.band:hover .band-track{animation-play-state:paused}
.band span{
  font-family:var(--f-disp); font-size:clamp(1.05rem,3vw,1.7rem); padding:13px 0; white-space:nowrap;
  display:flex; align-items:center; gap:28px; padding-inline:14px;
}
.band b{color:var(--yellow); font-weight:400}
@keyframes slide{to{transform:translateX(-50%)}}

/* ---- 共通セクション ---- */
.sec{padding-block:clamp(46px,8vw,96px)}
.sec-t{font-size:clamp(1.7rem,5.2vw,3.1rem); position:relative; display:inline-block}
.sec-t::after{content:""; position:absolute; left:0; right:-6px; bottom:-6px; height:9px; background:var(--yellow); z-index:-1; mix-blend-mode:var(--blend)}
.sec-n{font-family:var(--f-num); font-weight:800; font-size:12px; letter-spacing:.24em; color:var(--pink); margin-bottom:10px}
.sec-lead{margin-top:18px; max-width:38em; color:var(--ink-2); font-size:15px}

/* ---- 実績カウンタ ---- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:3px; background:var(--line); border:3px solid var(--line)}
.stat{background:var(--paper); padding:24px 20px 20px}
.stat-v{font-family:var(--f-num); font-weight:800; font-size:clamp(2.4rem,7vw,3.6rem); line-height:1; letter-spacing:-.03em; color:var(--blue)}
.stat-v small{font-size:.34em; margin-left:5px; color:var(--ink)}
.stat-l{margin-top:9px; font-size:13px; color:var(--ink-2); line-height:1.6}

/* ---- 課題カード（不揃いグリッド） ---- */
.cards{display:grid; grid-template-columns:repeat(12,1fr); gap:20px; margin-top:38px}
.card{
  grid-column:span 4; border:3px solid var(--line); background:var(--paper); padding:24px 22px 26px;
  transition:transform .2s cubic-bezier(.2,.9,.3,1.3), box-shadow .2s;
}
.card:nth-child(1){transform:rotate(-.8deg)}
.card:nth-child(2){transform:translateY(24px) rotate(.5deg)}
.card:nth-child(3){transform:rotate(1deg)}
.card:hover{transform:translateY(-6px) rotate(0deg); box-shadow:10px 10px 0 var(--pink)}
.card-n{font-family:var(--f-num); font-weight:800; font-size:44px; line-height:1; color:var(--pink); mix-blend-mode:var(--blend)}
.card-q{font-family:var(--f-disp); font-size:1.02rem; line-height:1.6; margin-top:12px}
.card-hr{height:3px; background:var(--line); margin:16px 0 14px}
.card-a-l{font-family:var(--f-num); font-weight:800; font-size:10.5px; letter-spacing:.18em; color:var(--blue)}
.card-a{font-size:14px; margin-top:5px; color:var(--ink-2); line-height:1.85}
@media (max-width:860px){.card{grid-column:span 12; transform:none!important}}

/* ---- 組み立て機 ---- */
.mk{border:3px solid var(--line); background:var(--paper); margin-top:34px}
.mk-head{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:baseline; padding:16px 22px; border-bottom:3px solid var(--line); background:var(--yellow); color:#111634}
.mk-head h3{font-size:1.15rem}
.mk-head span{font-family:var(--f-num); font-size:11.5px; font-weight:600; letter-spacing:.1em}
.mk-body{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
@media (max-width:900px){.mk-body{grid-template-columns:1fr}}
.mk-pick{padding:22px; border-right:3px solid var(--line)}
@media (max-width:900px){.mk-pick{border-right:0; border-bottom:3px solid var(--line)}}
.pick-g{margin-bottom:20px}
.pick-g:last-child{margin-bottom:0}
.pick-l{font-family:var(--f-num); font-weight:800; font-size:10.5px; letter-spacing:.18em; color:var(--ink-2); display:flex; align-items:center; gap:8px}
.pick-l i{width:18px; height:18px; display:grid; place-items:center; background:var(--band-bg); color:var(--band-fg); font-size:10px; font-style:normal}
.pick-o{display:flex; flex-wrap:wrap; gap:7px; margin-top:9px}
.opt{
  border:2px solid var(--line); background:transparent; padding:6px 13px; font-size:13px; cursor:pointer;
  transition:transform .12s, background .12s, color .12s;
}
.opt:hover{transform:translateY(-2px)}
.opt[aria-pressed="true"]{background:var(--pink); color:#111634; font-weight:700; box-shadow:4px 4px 0 var(--line)}
.mk-out{padding:22px; background:var(--paper-2)}
.spec-k{font-family:var(--f-num); font-weight:800; font-size:10.5px; letter-spacing:.18em; color:var(--pink)}
.spec-n{font-family:var(--f-disp); font-size:clamp(1.3rem,4vw,1.85rem); margin-top:6px; line-height:1.3}
.spec-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:3px; background:var(--line); border:3px solid var(--line); margin-top:18px}
.spec-c{background:var(--paper); padding:12px 13px}
.spec-c b{display:block; font-family:var(--f-num); font-weight:800; font-size:1.45rem; line-height:1.15; color:var(--blue)}
.spec-c span{font-size:10.5px; color:var(--ink-2); letter-spacing:.04em}
.pipe{margin-top:18px}
.pipe svg{display:block; width:100%; height:auto}
.perm{margin-top:16px; font-size:12.5px; color:var(--ink-2); border-top:3px solid var(--line); padding-top:12px}
.perm b{color:var(--ink)}

/* ---- カリキュラム ---- */
.steps{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:3px; background:var(--line); border:3px solid var(--line); margin-top:34px}
.step{background:var(--paper); padding:22px 20px; position:relative; transition:background .2s}
.step:hover{background:var(--yellow); color:#111634}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.steps{grid-template-columns:1fr}}
.step-n{font-family:var(--f-num); font-weight:800; font-size:13px; letter-spacing:.14em; color:var(--pink)}
.step:hover .step-n{color:#111634}
.step h3{font-size:1.05rem; margin-top:8px; line-height:1.45}
.step p{font-size:13px; margin-top:9px; color:var(--ink-2); line-height:1.8}
.step:hover p{color:#2b3050}

/* ---- 受講者の声 ---- */
.voice{border:3px solid var(--line); background:var(--paper); padding:clamp(24px,5vw,44px); margin-top:30px; position:relative; min-height:230px; display:flex; flex-direction:column; justify-content:center}
.voice-q{font-family:var(--f-disp); font-size:clamp(1.1rem,3.3vw,1.7rem); line-height:1.65}
.voice-w{margin-top:20px; font-family:var(--f-num); font-size:12px; font-weight:600; letter-spacing:.1em; color:var(--ink-2)}
.voice-nav{display:flex; gap:8px; margin-top:22px}
.dot{width:38px; height:8px; border:2px solid var(--line); background:transparent; cursor:pointer; padding:0}
.dot[aria-current="true"]{background:var(--pink)}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* ---- FAQ ---- */
.faq{border-top:3px solid var(--line); margin-top:30px}
.qa{border-bottom:3px solid var(--line)}
.qa-b{
  width:100%; text-align:left; background:transparent; border:0; cursor:pointer; padding:18px 44px 18px 0;
  font-family:var(--f-disp); font-size:clamp(.98rem,2.6vw,1.12rem); position:relative; line-height:1.5;
}
.qa-b::after{
  content:"＋"; position:absolute; right:8px; top:50%; translate:0 -50%;
  font-family:var(--f-num); font-weight:800; color:var(--pink); transition:rotate .25s; font-size:20px;
}
.qa-b[aria-expanded="true"]::after{rotate:45deg}
.qa-a{overflow:hidden; display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s ease}
.qa-a.open{grid-template-rows:1fr}
.qa-a>div{min-height:0}
.qa-a p{padding:0 0 20px; font-size:14px; color:var(--ink-2); max-width:56em}

/* ---- 申し込み ---- */
.end{border:3px solid var(--line); background:var(--band-bg); color:var(--band-fg); padding:clamp(30px,6vw,60px); margin-block:clamp(40px,7vw,80px); position:relative; overflow:hidden}
.end h2{font-size:clamp(1.7rem,5.6vw,3.2rem); color:var(--band-fg)}
.end p{margin-top:16px; max-width:34em; color:#dfe4ff}
.seal{
  position:absolute; right:clamp(-20px,-2vw,0px); top:50%; translate:0 -50%; rotate:-14deg;
  width:clamp(120px,17vw,190px); aspect-ratio:1; border:5px solid var(--yellow); border-radius:50%;
  display:grid; place-items:center; text-align:center; font-family:var(--f-disp); color:var(--yellow);
  font-size:clamp(.8rem,1.7vw,1.05rem); line-height:1.35; animation:seal 9s ease-in-out infinite; opacity:.95;
}
@keyframes seal{0%,100%{rotate:-14deg} 50%{rotate:-8deg}}
@media (max-width:760px){.seal{display:none}}

.foot{border-top:3px solid var(--line); padding-block:26px 44px; font-size:12.5px; color:var(--ink-2)}
.foot b{color:var(--ink); font-family:var(--f-disp); font-weight:400; font-size:15px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<div class="prog" id="prog"></div>
<div id="root"></div>
<style>
/* 版ズレは読み込み時に一度合わせ、以降はスクロール速度で再びズレる */
.riso .p1{animation:reg1 1s cubic-bezier(.16,1,.3,1) backwards; transform:translate(calc((var(--sp) + 2.5px) * -1),0)}
.riso .p2{animation:reg2 1s cubic-bezier(.16,1,.3,1) backwards; transform:translate(calc(var(--sp) + 2.5px),0)}
@keyframes reg1{from{transform:translate(-.085em,.042em) rotate(-.7deg)} to{transform:translate(-2.5px,0)}}
@keyframes reg2{from{transform:translate(.075em,-.038em) rotate(.6deg)} to{transform:translate(2.5px,0)}}
.sec-t,.stat-v,.spec-n{text-shadow:calc(var(--sp) * -1) 0 0 var(--pink), var(--sp) 0 0 var(--blue)}

/* 工程図 */
.tok{animation:flow 3.4s linear infinite}
@keyframes flow{
  0%{transform:translateY(0); opacity:0}
  7%{opacity:1} 93%{opacity:1}
  100%{transform:translateY(186px); opacity:0}
}
.pr{animation:pulse 3.4s linear infinite}
@keyframes pulse{0%,100%{opacity:0} 6%,18%{opacity:1} 30%{opacity:0}}
.pipe text{font-family:var(--f-body)}
</style>

/* ---------- 版ズレとスクロール進捗 ---------- */
function useScrollFx() {
  useEffect(() => {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const bar = document.getElementById("prog");
    let last = scrollY, v = 0, raf = 0;
    const onScroll = () => {
      const y = scrollY;
      v = Math.min(7, v + Math.abs(y - last) * 0.09);
      last = y;
      const max = document.documentElement.scrollHeight - innerHeight;
      bar.style.width = (max > 0 ? (y / max) * 100 : 0) + "%";
    };
    const tick = () => {
      v *= 0.86;
      if (v < 0.02) v = 0;
      document.documentElement.style.setProperty("--sp", v.toFixed(2) + "px");
      raf = requestAnimationFrame(tick);
    };
    addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    if (!reduce) raf = requestAnimationFrame(tick);
    return () => { removeEventListener("scroll", onScroll); cancelAnimationFrame(raf); };
  }, []);
}

/* ---------- 網点の背景（指に反応します） ---------- */
function Halftone() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current, ctx = c.getContext("2d");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const dpr = Math.min(2, devicePixelRatio || 1);
    let raf = 0, t = 0, mx = -9e3, my = -9e3, col = "rgba(26,52,160,.3)", f = 0;
    const size = () => { const r = c.getBoundingClientRect(); c.width = Math.max(1, r.width * dpr); c.height = Math.max(1, r.height * dpr); };
    const draw = () => {
      const w = c.width, hh = c.height, gap = 21 * dpr, R = 165 * dpr;
      if (f % 40 === 0) col = getComputedStyle(document.documentElement).getPropertyValue("--dot").trim() || col;
      f++;
      ctx.clearRect(0, 0, w, hh);
      ctx.fillStyle = col;
      for (let y = gap / 2; y < hh; y += gap) {
        for (let x = gap / 2; x < w; x += gap) {
          const wave = Math.sin(x * 0.011 + y * 0.015 + t) * 0.5 + 0.5;
          let r = (0.9 + wave * 1.6) * dpr;
          const d = Math.hypot(x - mx * dpr, y - my * dpr);
          if (d < R) r += (1 - d / R) * 4.6 * dpr;
          ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
        }
      }
    };
    const loop = () => { t += 0.012; draw(); raf = requestAnimationFrame(loop); };
    const onMove = e => { const r = c.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; };
    const onLeave = () => { mx = my = -9e3; };
    size(); draw();
    const ro = new ResizeObserver(() => { size(); draw(); });
    ro.observe(c);
    if (!reduce) {
      raf = requestAnimationFrame(loop);
      const host = c.parentElement;
      host.addEventListener("pointermove", onMove);
      host.addEventListener("pointerleave", onLeave);
      return () => { cancelAnimationFrame(raf); ro.disconnect(); host.removeEventListener("pointermove", onMove); host.removeEventListener("pointerleave", onLeave); };
    }
    return () => ro.disconnect();
  }, []);
  return h("canvas", { id: "dots", ref, "aria-hidden": "true" });
}

/* ---------- 数字が上がる ---------- */
function Counter({ to, unit }) {
  const [n, setN] = useState(() => matchMedia("(prefers-reduced-motion: reduce)").matches ? to : 0);
  useEffect(() => {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let raf = 0; const t0 = performance.now(), D = 1200;
    const step = now => {
      const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
      setN(Math.round(to * e));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [to]);
  return h("div", { className: "stat-v" }, n.toLocaleString("ja-JP"), h("small", null, unit));
}

/* ---------- 工程図 ---------- */
const cut = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);
function Pipe({ stages }) {
  const W = 340, rowH = 46, gap = 16, H = stages.length * (rowH + gap) - gap + 4;
  const rows = stages.map((s, i) => {
    const y = i * (rowH + gap);
    return h("g", { key: i },
      h("rect", { x: 1.5, y, width: W - 3, height: rowH, fill: "var(--paper)", stroke: "var(--line)", strokeWidth: 3 }),
      h("rect", { className: "pr", x: 1.5, y, width: W - 3, height: rowH, fill: "var(--yellow)", opacity: 0, style: { animationDelay: (i * 0.85) + "s" } }),
      h("rect", { x: 1.5, y, width: 40, height: rowH, fill: "var(--band-bg)" }),
      h("text", { x: 21.5, y: y + 30, textAnchor: "middle", fontSize: 17, fontWeight: 800, fill: "var(--band-fg)", fontFamily: "var(--f-num)" }, i + 1),
      h("text", { x: 54, y: y + 20, fontSize: 13, fontWeight: 700, fill: "var(--ink)" }, s.t),
      h("text", { x: 54, y: y + 36, fontSize: 11, fill: "var(--ink-2)" }, cut(s.d, 26)),
      i < stages.length - 1 ? h("polygon", { points: `15,${y + rowH + 4} 28,${y + rowH + 4} 21.5,${y + rowH + 13}`, fill: "var(--line)" }) : null);
  });
  const toks = [0, 1.13, 2.26].map(d =>
    h("circle", { key: d, className: "tok", cx: 21.5, cy: 23, r: 5.5, fill: "var(--pink)", stroke: "var(--paper)", strokeWidth: 2, style: { animationDelay: d + "s" } }));
  return h("div", { className: "pipe" },
    h("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "選んだ内容でできる処理の流れ" }, rows, toks));
}

/* ---------- 組み立て機（このページの心臓部） ---------- */

  return h("section", { className: "sec wrap", id: "maker" },
    h("div", { className: "sec-n" }, "WORKSHOP / 3つ選ぶと仕様ができます"),
    h("h2", { className: "sec-t" }, "組み立て機"),
    h("p", { className: "sec-lead" }, "第1回でやることの縮小版です。自分の仕事に近いものを選ぶと、6週間の終わりに何ができているかの見取り図が出ます。渡す資料は3つまで、というのが工房の決まりです。"),
    h("div", { className: "mk" },
      h("div", { className: "mk-head" }, h("h3", null, "エージェント組み立て機"), h("span", null, "MK-III / 体験版")),
      h("div", { className: "mk-body" },
        h("div", { className: "mk-pick" },
          group("1", "どの仕事を任せますか", CONTENT.jobs.map(x =>
            h("button", { key: x.id, className: "opt", type: "button", "aria-pressed": job === x.id, onClick: () => setJob(x.id) }, x.n))),
          group("2", "何を渡しますか（最大3つ）", CONTENT.sources.map(x =>
            h("button", { key: x.id, className: "opt", type: "button", "aria-pressed": srcs.includes(x.id), onClick: () => toggle(x.id) }, x.n))),
          group("3", "どこに返しますか", CONTENT.outputs.map(x =>
            h("button", { key: x.id, className: "opt", type: "button", "aria-pressed": out === x.id, onClick: () => setOut(x.id) }, x.n)))),
        h("div", { className: "mk-out" },
          h("div", { className: "spec-k" }, "できあがる予定のもの"),
          h("div", { className: "spec-n" }, J.agent + "アシスタント"),
          h("p", { style: { fontSize: "13px", marginTop: "8px", lineHeight: 1.85 } }, J.d),
          h("div", { className: "spec-grid" },
            h("div", { className: "spec-c" }, h("b", null, hours), h("span", null, "想定削減 時間/月")),
            h("div", { className: "spec-c" }, h("b", null, level), h("span", null, "つくる難しさ")),
            h("div", { className: "spec-c" }, h("b", null, weeks), h("span", null, "公開までの週数"))),
          h(Pipe, { stages }),
          h("div", { className: "perm" }, h("b", null, "先に申請しておくもの："),
            S.map(s => s.perm).join(" / ") + "。第2回までに所属長の承認を取っておくと、第3回で待たずに済みます。"))))
  );
}
