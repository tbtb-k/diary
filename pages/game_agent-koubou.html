<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>エージェント工房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="指示・知識・ツールを組み合わせて、総務部のAIエージェントを1体育てる学習ゲーム。テストして、失敗を見て、直す。Copilot Studio の考え方を体で覚えます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1:wght@400;500;700;800&family=Archivo:wght@600;800&display=swap">
<style>
/* レイアウト：工房の作業台。左に「依頼票」と「エージェントの設計図」、右に「テストパネル」。
   見た目はサイトの「エージェント工房」テンプレートと同じリソグラフ（3色刷り・版ズレ・網点）。 */
:root{
  color-scheme: light;
  --paper:#ece9e0;  --paper-2:#e2ded2; --card:#f7f5ef;
  --ink:#111634;    --ink-2:#464b68;   --ink-3:#8a8ea6;
  --blue:#1a34a0;   --pink:#ff3d8b;    --yellow:#ffc61a; --green:#00a95c;
  --on-blue:#ffffff; --on-acc:#111634;
  --line:#111634;   --blend:multiply;  --dot:rgba(26,52,160,.24);
  --ok:#008f4e;     --ng:#e8246f;      --scrim:rgba(17,22,52,.55);
  --f-disp:"Dela Gothic One","M PLUS 1",system-ui,sans-serif;
  --f-body:"M PLUS 1",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;
  --f-num:"Archivo","M PLUS 1",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#141d4a; --paper-2:#1b2660; --card:#1a2459;
    --ink:#f2efe6;   --ink-2:#b4bbe0;   --ink-3:#7d86b6;
    --blue:#7590ff;  --pink:#ff5c9c;    --yellow:#ffc61a; --green:#3ad18d;
    --on-blue:#0d1336; --on-acc:#111634;
    --line:#f2efe6;  --blend:screen;    --dot:rgba(255,92,156,.28);
    --ok:#3ad18d;    --ng:#ff6fa8;      --scrim:rgba(4,7,24,.72);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#141d4a; --paper-2:#1b2660; --card:#1a2459;
  --ink:#f2efe6;   --ink-2:#b4bbe0;   --ink-3:#7d86b6;
  --blue:#7590ff;  --pink:#ff5c9c;    --yellow:#ffc61a; --green:#3ad18d;
  --on-blue:#0d1336; --on-acc:#111634;
  --line:#f2efe6;  --blend:screen;    --dot:rgba(255,92,156,.28);
  --ok:#3ad18d;    --ng:#ff6fa8;      --scrim:rgba(4,7,24,.72);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased; overflow-x:clip;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:90; background:var(--paper)}
h1,h2,h3,h4{margin:0; font-family:var(--f-disp); font-weight:400; line-height:1.25; text-wrap:balance}
p,ul,ol,blockquote,pre{margin:0}
ul,ol{padding:0; list-style:none}
button{font:inherit; color:inherit; cursor:pointer}
input{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--pink); outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important; animation-iteration-count:1!important; animation-delay:0s!important; transition-duration:.01ms!important}
}
.wrap{width:min(1240px,100%); margin-inline:auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums}
.kick{font-family:var(--f-num); font-weight:800; font-size:11px; letter-spacing:.2em; color:var(--pink); text-transform:uppercase}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- ボタン ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  font-family:var(--f-disp); font-size:1.05rem; line-height:1.3; text-align:center;
  padding:13px 24px; border:3px solid var(--line); background:var(--pink); color:var(--on-acc);
  box-shadow:6px 6px 0 var(--line); text-decoration:none;
  transition:transform .14s cubic-bezier(.2,.9,.3,1.3), box-shadow .14s;
}
.btn:hover{transform:translate(-2px,-2px); box-shadow:8px 8px 0 var(--line)}
.btn:active{transform:translate(4px,4px); box-shadow:2px 2px 0 var(--line)}
.btn.blue{background:var(--blue); color:var(--on-blue)}
.btn.yellow{background:var(--yellow)}
.btn.ghost{background:var(--card); color:var(--ink)}
.btn.sm{font-size:.92rem; padding:9px 15px; box-shadow:4px 4px 0 var(--line)}
.btn.sm:hover{box-shadow:6px 6px 0 var(--line)}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none; box-shadow:3px 3px 0 var(--line)}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:6px 6px 0 var(--line)} 50%{box-shadow:6px 6px 0 var(--line), 0 0 0 7px color-mix(in srgb, var(--pink) 35%, transparent)}}
.linkish{border:0; background:none; padding:4px 0; font-size:13px; color:var(--ink-2); text-decoration:underline; text-underline-offset:3px}

/* ---------- 種類タグ ---------- */
.tag{
  display:inline-flex; align-items:center; gap:4px; flex:none;
  font-size:11.5px; font-weight:800; letter-spacing:.06em; line-height:1.4;
  padding:2px 8px; border:2px solid var(--line); white-space:nowrap;
}
.t-instr{background:var(--yellow); color:var(--on-acc)}
.t-know{background:var(--blue); color:var(--on-blue)}
.t-tool{background:var(--pink); color:var(--on-acc)}
.t-node,.t-topic{background:var(--green); color:var(--on-acc)}
.t-set{background:var(--card); color:var(--ink)}
.t-desc{background:var(--paper-2); color:var(--ink)}
.t-final{background:var(--ink); color:var(--paper)}

/* ---------- 星 ---------- */
.stars{display:inline-flex; gap:2px; font-size:17px; line-height:1; letter-spacing:0}
.stars i{font-style:normal; color:transparent; -webkit-text-stroke:1.6px var(--ink-3)}
.stars i.on{color:var(--yellow); -webkit-text-stroke:1.6px var(--line)}

/* =========================================================
   タイトル画面
   ========================================================= */
.hero{position:relative; overflow:clip; border-bottom:3px solid var(--line)}
#dots{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.hero-in{position:relative; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); gap:20px 32px; align-items:center; padding-block:clamp(34px,7vw,80px) clamp(34px,6vw,70px)}
@media (max-width:840px){.hero-in{grid-template-columns:1fr}}
.eyebrow{display:inline-block; font-family:var(--f-num); font-weight:800; font-size:11.5px; letter-spacing:.18em; border:2px solid var(--line); padding:4px 12px; background:var(--yellow); color:var(--on-acc)}
.hero-text{container-type:inline-size; min-width:0}
.riso{position:relative; display:inline-block; margin-top:18px; font-size:clamp(2.6rem,10.5vw,6rem); font-size:clamp(2.6rem,15.2cqi,6.6rem); line-height:1}
.riso .l{display:block; white-space:nowrap}
.riso .p0{position:relative; color:var(--ink)}
.riso .p1,.riso .p2{position:absolute; inset:0; mix-blend-mode:var(--blend); pointer-events:none}
.riso .p1{color:var(--pink); transform:translate(-3px,1px); animation:reg1 1.1s cubic-bezier(.16,1,.3,1) backwards}
.riso .p2{color:var(--blue); transform:translate(3px,-1px); animation:reg2 1.1s cubic-bezier(.16,1,.3,1) backwards}
@keyframes reg1{from{transform:translate(-.09em,.05em) rotate(-.8deg)}}
@keyframes reg2{from{transform:translate(.08em,-.04em) rotate(.7deg)}}
.lead{margin-top:22px; max-width:31em; font-size:clamp(1rem,2.4vw,1.12rem); line-height:2}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:20px}
.chip{font-size:12.5px; font-weight:700; border:2px solid var(--line); padding:3px 11px; background:var(--card)}
.cta-row{display:flex; flex-wrap:wrap; gap:14px; margin-top:28px; align-items:center}
.hero-robot{width:100%; max-width:440px; justify-self:center; position:relative}
.hero-robot .robot{filter:drop-shadow(0 0 0 transparent)}
.hero-cap{position:absolute; right:2%; top:4%; font-size:11px; font-weight:800; letter-spacing:.12em; background:var(--card); border:2px solid var(--line); padding:2px 8px; rotate:3deg}

.band{border-block:3px solid var(--line); background:var(--blue); color:var(--on-blue); overflow:hidden; transform:rotate(-1.1deg) scale(1.04); margin-block:clamp(30px,5vw,54px)}
.band-track{display:flex; width:max-content; animation:slide 30s linear infinite}
.band span{font-family:var(--f-disp); font-size:clamp(1rem,2.8vw,1.55rem); padding-block:11px; white-space:nowrap; display:flex; align-items:center; gap:26px; padding-inline:13px}
.band b{color:var(--yellow); font-weight:400}
@keyframes slide{to{transform:translateX(-50%)}}

.sec{padding-block:clamp(20px,4vw,40px)}
.sec-t{font-size:clamp(1.6rem,4.8vw,2.6rem); position:relative; display:inline-block; margin-top:6px}
.sec-t::after{content:""; position:absolute; left:0; right:-6px; bottom:-5px; height:9px; background:var(--yellow); z-index:-1; mix-blend-mode:var(--blend)}
.sec-lead{margin-top:14px; max-width:40em; color:var(--ink-2)}

.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px; margin-top:26px}
.tile{
  position:relative; display:grid; gap:6px; align-content:start; text-align:left; min-width:0;
  border:3px solid var(--line); background:var(--card); padding:16px 16px 14px;
  box-shadow:5px 5px 0 var(--line); transition:transform .16s cubic-bezier(.2,.9,.3,1.3), box-shadow .16s;
}
.tile:hover{transform:translate(-2px,-2px); box-shadow:8px 8px 0 var(--pink)}
.tile[disabled]{box-shadow:none; border-style:dashed; opacity:.6; cursor:not-allowed; transform:none}
.tile-top{display:flex; align-items:center; gap:10px}
.tile-n{font-family:var(--f-num); font-weight:800; font-size:36px; line-height:1; color:var(--pink); mix-blend-mode:var(--blend)}
.tile-t{font-family:var(--f-disp); font-size:1.02rem; line-height:1.45}
.tile-w{font-size:12.5px; color:var(--ink-2)}
.tile-f{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:4px}
.lec{font-size:11px; font-weight:800; letter-spacing:.08em; padding:1px 8px; border:2px solid var(--line); background:var(--blue); color:var(--on-blue)}
.tile-lock{font-size:12px; color:var(--ink-2)}

.how{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:3px; background:var(--line); border:3px solid var(--line); margin-top:26px}
@media (max-width:760px){.how{grid-template-columns:1fr}}
.how > div{background:var(--card); padding:18px 18px 20px}
.how-n{font-family:var(--f-num); font-weight:800; font-size:12px; letter-spacing:.16em; color:var(--pink)}
.how h3{font-size:1.05rem; margin-top:6px}
.how p{font-size:13.5px; color:var(--ink-2); margin-top:8px; line-height:1.85}
.rules{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:18px}
@media (max-width:760px){.rules{grid-template-columns:1fr}}
.rule{display:flex; gap:10px; align-items:flex-start; font-size:13.5px; line-height:1.7}
.rule .stars{font-size:20px; margin-top:1px}

.foot{border-top:3px solid var(--line); margin-top:clamp(30px,6vw,60px); padding-block:24px 40px; font-size:12.5px; color:var(--ink-2); display:grid; gap:8px}
.foot b{color:var(--ink); font-family:var(--f-disp); font-weight:400; font-size:15px}

/* =========================================================
   プレイ画面
   ========================================================= */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--paper); border-bottom:3px solid var(--line)}
.bar .wrap{display:flex; align-items:center; gap:12px; min-height:56px}
.logo{border:0; background:none; padding:6px 0; font-family:var(--f-disp); font-size:1.02rem; white-space:nowrap}
.bar-mid{display:flex; align-items:center; gap:8px; min-width:0; flex:1}
.bar-no{font-family:var(--f-num); font-weight:800; font-size:13px; letter-spacing:.08em; white-space:nowrap}
.bar-no small{color:var(--ink-3); font-size:11px}
.bar-t{font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
@media (max-width:640px){.logo,.bar-t{display:none}}

.bar .wrap,.play{width:min(1560px,100%)}
.play{display:grid; grid-template-columns:minmax(0,1fr) minmax(340px,420px); grid-template-areas:"a r" "b r"; gap:20px 22px; align-items:start; padding-block:20px 48px}
.brief{grid-area:a}
.col-b{grid-area:b; display:grid; gap:20px; min-width:0}
.col-r{grid-area:r; position:sticky; top:calc(env(safe-area-inset-top,0px) + 72px); min-width:0}
@media (min-width:1200px){
  .play{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr) minmax(340px,400px); grid-template-areas:"a b r"}
  .ed-head{grid-template-columns:minmax(140px,190px) minmax(0,1fr)}
  .ed-name h3{font-size:1.2rem}
}

.card{border:3px solid var(--line); background:var(--card); min-width:0; position:relative}
.card-h{display:flex; align-items:center; flex-wrap:wrap; gap:6px 12px; padding:11px 16px; border-bottom:3px solid var(--line); background:var(--paper-2)}
.card-h h3{font-size:1rem}
.card-h small{font-size:12px; color:var(--ink-2)}

/* 依頼票 */
.brief{padding:18px 18px 16px; display:grid; gap:14px}
.brief-top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px}
.brief-meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.brief-t{font-size:clamp(1.3rem,3.6vw,1.75rem)}
.who{display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:start}
.ava{width:48px; height:48px; display:grid; place-items:center; border:3px solid var(--line); border-radius:50%; font-family:var(--f-disp); font-size:.82rem; letter-spacing:-.02em; color:var(--on-acc)}
.ava.c-pink{background:var(--pink)} .ava.c-blue{background:var(--blue); color:var(--on-blue)} .ava.c-green{background:var(--green)} .ava.c-yellow{background:var(--yellow)}
.who-n{font-size:12px; color:var(--ink-2); margin-bottom:4px}
.who-n b{color:var(--ink); font-size:13.5px; margin-right:6px}
.quote{position:relative; background:var(--paper); border:2.5px solid var(--line); border-radius:4px 16px 16px 16px; padding:11px 14px; font-size:14.5px; line-height:1.9}

.tests{border:2.5px solid var(--line)}
.tests-h{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:7px 12px; background:var(--ink); color:var(--paper)}
.tests-h b{font-size:13px; letter-spacing:.06em}
.tests-h small{font-size:11.5px; opacity:.85}
.trow{display:grid; grid-template-columns:28px minmax(0,1fr) 34px; gap:10px; align-items:start; padding:10px 12px; border-top:2px solid var(--line); transition:opacity .2s, background .2s}
.trow:first-of-type{border-top:0}
.tnum{width:26px; height:26px; display:grid; place-items:center; border:2px solid var(--line); font-family:var(--f-num); font-weight:800; font-size:13px; background:var(--card)}
.tq b{display:block; font-size:14px; line-height:1.6}
.tq small{display:block; font-size:12px; color:var(--ink-2); line-height:1.6; margin-top:2px}
.tst{width:32px; height:32px; display:grid; place-items:center; border:2.5px solid var(--line); font-family:var(--f-num); font-weight:800; font-size:16px; background:var(--card); color:var(--ink-3)}
.trow.is-ok .tst{background:var(--green); color:var(--on-acc)}
.trow.is-ng .tst{background:var(--pink); color:var(--on-acc)}
.trow.is-run .tst{animation:blinkbg .7s steps(2) infinite}
@keyframes blinkbg{50%{background:var(--yellow)}}
.trow.is-ng{background:color-mix(in srgb, var(--pink) 9%, var(--card))}
.trows.stale .trow{opacity:.55}
.twhy{margin-top:7px; font-size:12.5px; line-height:1.7; padding:6px 9px; border:2px solid var(--line); background:var(--card)}
.twhy em{font-style:normal; font-weight:800; color:var(--ng); margin-right:4px}
.hint-b{margin-top:6px; border:2px solid var(--line); background:var(--yellow); color:var(--on-acc); font-size:12px; font-weight:800; padding:2px 10px}
.thint{margin-top:6px; font-size:12.5px; line-height:1.7; font-weight:700}
.trow.bonus .tnum{background:var(--yellow); color:var(--on-acc)}
.trow.locked .tq b{color:var(--ink-3)}

/* エージェントの設定 */
.ed-head{display:grid; grid-template-columns:minmax(150px,230px) minmax(0,1fr); gap:6px 18px; align-items:center; padding:14px 18px 6px; border-bottom:3px solid var(--line); background:
  radial-gradient(var(--dot) 1.2px, transparent 1.4px) 0 0/13px 13px, var(--paper)}
@media (max-width:520px){.ed-head{grid-template-columns:132px minmax(0,1fr); padding:10px 12px 4px; gap:6px 10px}}
.ed-name h3{font-size:clamp(1.15rem,3.4vw,1.5rem); margin-top:2px}
.ed-status{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; font-size:12px}
.pill{font-weight:800; padding:1px 9px; border:2px solid var(--line); background:var(--card)}
.pill.ok{background:var(--green); color:var(--on-acc)} .pill.ng{background:var(--pink); color:var(--on-acc)} .pill.run{background:var(--yellow); color:var(--on-acc)}
.secs{display:grid}
.sec-x{border-top:2.5px solid var(--line); padding:12px 16px 14px}
.sec-x:first-child{border-top:0}
.sec-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:9px}
.sec-en{font-family:var(--f-num); font-weight:600; font-size:11.5px; letter-spacing:.14em; color:var(--ink-3); text-transform:uppercase}
.sec-flag{margin-left:auto; font-size:11.5px; font-weight:800; padding:1px 9px; border:2px solid var(--line); background:var(--yellow); color:var(--on-acc); rotate:-2deg}
.sec-lock{margin-left:auto; font-size:11.5px; color:var(--ink-2)}
.sec-x.s-edit{background:color-mix(in srgb, var(--yellow) 12%, var(--card)); box-shadow:inset 6px 0 0 var(--yellow)}
.sec-x.s-future{padding-block:9px}
.sec-x.s-future .sec-h{margin:0; opacity:.6}
.sec-x.s-future .tag{border-style:dashed; background:transparent; color:var(--ink-2)}
.empty{font-size:13px; color:var(--ink-3); padding:8px 10px; border:2px dashed var(--ink-3)}
.lines{display:grid; border:2px solid var(--line); background:var(--card)}
.line{display:grid; grid-template-columns:22px auto minmax(0,1fr) auto; gap:8px; align-items:start; padding:7px 8px 7px 0; border-top:1.5px solid color-mix(in srgb, var(--line) 25%, transparent); font-size:13.5px; line-height:1.65}
.line:first-child{border-top:0}
.line-no{font-family:var(--f-num); font-size:11px; color:var(--ink-3); text-align:right; padding-top:2px}
.line-tag{font-size:10.5px; font-weight:800; padding:0 6px; border:1.5px solid var(--line); margin-top:2px; white-space:nowrap}
.x{width:28px; height:28px; display:grid; place-items:center; border:2px solid var(--line); background:var(--card); font-weight:800; font-size:14px; line-height:1; padding:0}
.x:hover{background:var(--pink); color:var(--on-acc)}
.x[disabled]{opacity:.3; cursor:not-allowed; background:var(--card)}
.items{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px}
.item{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:9px; align-items:center; padding:7px 8px; border:2px solid var(--line); background:var(--card); min-width:0}
.item b{display:block; font-size:13px; line-height:1.45; word-break:break-all}
.item small{display:block; font-size:11.5px; color:var(--ink-2); line-height:1.5}
.item.danger{background:color-mix(in srgb, var(--pink) 16%, var(--card))}
.item.danger small{color:var(--ng); font-weight:700}
.ico{width:26px; height:30px; flex:none}
.chipline{display:flex; flex-wrap:wrap; gap:6px}
.mini{font-size:12px; font-weight:700; padding:2px 9px; border:2px solid var(--line); background:var(--card); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mini.danger{background:var(--pink); color:var(--on-acc)}

.sw-row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:8px 10px; border:2px solid var(--line); background:var(--card)}
.sw-row + .sw-row{border-top:0}
.sw-row b{font-size:13.5px}
.sw-row small{display:block; font-size:11.5px; color:var(--ink-2); line-height:1.55}
.sw{position:relative; width:58px; height:30px; border:2.5px solid var(--line); background:var(--paper-2); padding:0; flex:none}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:21px; height:21px; background:var(--card); border:2.5px solid var(--line); transition:left .18s cubic-bezier(.2,.9,.3,1.3)}
.sw[aria-checked="true"]{background:var(--blue)}
.sw[aria-checked="true"]::after{left:29px}
.sw-l{font-family:var(--f-num); font-weight:800; font-size:11px; letter-spacing:.1em; min-width:26px; display:inline-block; text-align:right; margin-right:6px}
.sw[disabled]{opacity:.55; cursor:not-allowed}

.flow{display:grid; gap:0; justify-items:stretch}
.trig{font-size:12.5px; padding:7px 10px; border:2px solid var(--line); background:var(--paper)}
.trig b{font-weight:800}
.arrow{width:2.5px; height:12px; background:var(--line); justify-self:center}
.node{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px; align-items:center; padding:6px 7px; border:2px solid var(--line); background:var(--card)}
.node b{font-size:13px; line-height:1.5}
.node small{display:block; font-size:11px; color:var(--ink-2)}
.node-c{display:flex; gap:4px}
.node .x{width:26px; height:26px; font-size:12px}

.desc-b{display:block; width:100%; text-align:left; margin-top:6px; border:2px dashed var(--line); background:var(--paper); padding:5px 8px; font-size:12px; line-height:1.55}
.desc-b.set{border-style:solid; background:color-mix(in srgb, var(--yellow) 30%, var(--card))}
.desc-b.vague{background:color-mix(in srgb, var(--pink) 14%, var(--card))}
.desc-b span{font-weight:800; margin-right:4px}
.ditem{padding:8px; border:2px solid var(--line); background:var(--card); min-width:0}
.ditem-top{display:flex; align-items:center; gap:8px}
.ditem-top b{font-size:13px; word-break:break-all}
.ditems{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px}

/* 部品トレイ */
.tray-b{padding:14px 16px 16px}
.parts{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px}
.part{
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:9px; align-items:center; text-align:left; min-width:0;
  border:2.5px solid var(--line); background:var(--card); padding:9px 10px;
  box-shadow:4px 4px 0 var(--line); transition:transform .12s cubic-bezier(.2,.9,.3,1.3), box-shadow .12s;
}
.part:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--line)}
.part:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--line)}
.part-t{font-size:13px; line-height:1.55; min-width:0}
.part-t b{display:block; font-weight:700}
.part-t small{display:block; font-size:11.5px; color:var(--ink-2)}
.part-plus{width:26px; height:26px; display:grid; place-items:center; border:2px solid var(--line); font-weight:800; background:var(--yellow); color:var(--on-acc)}
.part.danger .part-t small{color:var(--ng); font-weight:700}
.tray-none{font-size:13px; color:var(--ink-2)}
.tray.locked .tray-b{filter:blur(1.5px) grayscale(.6); opacity:.45; pointer-events:none; user-select:none}
.tray-lock{position:absolute; inset:52px 12px 12px; display:grid; place-items:center; text-align:center; pointer-events:none}
.tray-lock div{background:var(--card); border:3px solid var(--line); box-shadow:5px 5px 0 var(--line); padding:12px 16px; max-width:30em; font-size:14px; font-weight:700; line-height:1.75; pointer-events:auto}
.tray-lock div span{display:block; font-weight:400; font-size:12.5px; color:var(--ink-2); margin-top:4px}
.tray.shake .tray-lock div{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
body.running .part, body.running .x, body.running .sw, body.running .desc-b{pointer-events:none; opacity:.6}

/* テストパネル */
.tp{display:flex; flex-direction:column; max-height:calc(100dvh - 96px)}
.tp-h{display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:3px solid var(--line); background:var(--ink); color:var(--paper)}
.tp-h b{font-family:var(--f-disp); font-weight:400; font-size:1rem}
.tp-dot{width:10px; height:10px; border-radius:50%; background:var(--ink-3); flex:none}
.tp.running .tp-dot{background:var(--yellow); animation:blinkdot .6s steps(2) infinite}
@keyframes blinkdot{50%{opacity:.2}}
.tp-sess{font-size:12px; opacity:.85; margin-right:auto}
.tp-close{display:none; border:2px solid var(--paper); background:transparent; color:var(--paper); font-size:12px; font-weight:800; padding:3px 10px}
.tp-log{flex:1; min-height:260px; overflow-y:auto; overscroll-behavior:contain; padding:14px 14px 6px; display:flex; flex-direction:column;
  background:radial-gradient(var(--dot) 1.1px, transparent 1.35px) 0 0/14px 14px, var(--paper)}
.tp-empty{margin:auto 0; display:grid; gap:12px; justify-items:center; text-align:center; padding:16px 6px; color:var(--ink-2); font-size:13.5px; line-height:1.85}
.tp-empty .robot{width:150px}
.tp-foot{border-top:3px solid var(--line); padding:12px 14px 14px; display:grid; gap:10px; background:var(--card)}
.tp-foot .btn{width:100%}
.sumline{font-size:13px; line-height:1.7; font-weight:700}
.sumline span{font-family:var(--f-num); font-weight:800; font-size:18px; margin-right:6px}
.sess{align-self:center; font-size:11.5px; color:var(--ink-2); border:1.5px solid var(--ink-3); padding:1px 10px; background:var(--card); margin-bottom:12px}
.case{display:flex; flex-direction:column; gap:8px; margin-bottom:20px}
.case-h{display:flex; gap:8px; align-items:baseline; font-size:12px; line-height:1.5}
.case-h span{flex:none; font-family:var(--f-num); font-weight:800; letter-spacing:.12em; font-size:11px; background:var(--ink); color:var(--paper); padding:1px 7px}
.case-h span.bonus{background:var(--yellow); color:var(--on-acc); border:1.5px solid var(--line)}
.case-h em{font-style:normal; color:var(--ink-2)}
.msg{max-width:88%; padding:8px 13px; border:2.5px solid var(--line); white-space:pre-wrap; word-break:break-word; line-height:1.7; font-size:14px}
.msg.u{align-self:flex-end; background:var(--card); border-radius:14px 14px 4px 14px}
.msg.b{align-self:flex-start; background:var(--blue); color:var(--on-blue); border-radius:14px 14px 14px 4px}
.msg.b.ghost{background:transparent; color:var(--ink-3); border-style:dashed}
.msg.b.typing::after{content:"▍"; animation:blinkdot .5s steps(2) infinite; margin-left:1px}
.cite{align-self:flex-start; display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; border:2px solid var(--line); background:var(--yellow); color:var(--on-acc); padding:1px 9px; margin-top:-3px}
.acts{align-self:flex-start; display:grid; gap:4px; font-size:12px; color:var(--ink-2); padding:2px 0 2px 10px; border-left:2.5px dotted var(--ink-3); max-width:94%}
.act{display:flex; gap:7px; align-items:baseline; line-height:1.5; animation:fadein .25s ease both}
.act i{flex:none; font-style:normal; font-weight:800; font-size:10.5px; letter-spacing:.04em; padding:0 6px; border:1.5px solid var(--line); background:var(--card); color:var(--ink)}
.act.bad i{background:var(--pink); color:var(--on-acc)}
.act.bad{color:var(--ink)}
@keyframes fadein{from{opacity:0; transform:translateY(4px)}}
.judge{display:flex; gap:12px; align-items:center; margin-top:2px}
.stamp{flex:none; font-family:var(--f-disp); font-size:14px; line-height:1; padding:6px 9px; border:3.5px double currentColor; rotate:-8deg; mix-blend-mode:var(--blend); animation:stamp .34s cubic-bezier(.2,.9,.3,1.5) both}
.stamp.ok{color:var(--ok)} .stamp.ng{color:var(--ng)}
@keyframes stamp{from{transform:scale(2.2); opacity:0}}
.judge p{font-size:12.5px; line-height:1.65}

.dock{display:none}
.scrim{position:fixed; inset:0; background:var(--scrim); z-index:55; opacity:0; pointer-events:none; transition:opacity .25s}

@media (max-width:959px){
  .play{grid-template-columns:1fr; grid-template-areas:"a" "b"; padding-bottom:120px}
  .col-r{position:fixed; left:0; right:0; bottom:0; top:auto; z-index:60; transform:translateY(105%); transition:transform .38s cubic-bezier(.2,.9,.3,1); visibility:hidden}
  body.sheet .col-r{transform:none; visibility:visible}
  body.sheet .scrim{opacity:1; pointer-events:auto}
  body.sheet{overflow:hidden}
  .tp{max-height:calc(92dvh - env(safe-area-inset-top,0px)); height:calc(92dvh - env(safe-area-inset-top,0px)); border-left:0; border-right:0; border-bottom:0}
  .tp-h{padding-left:max(14px,env(safe-area-inset-left,0px)); padding-right:max(14px,env(safe-area-inset-right,0px))}
  .tp-close{display:inline-block}
  .tp-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px)); padding-left:max(14px,env(safe-area-inset-left,0px)); padding-right:max(14px,env(safe-area-inset-right,0px))}
  .dock{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:50; gap:12px; align-items:center;
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    background:var(--paper); border-top:3px solid var(--line)}
  .dock-s{flex:1; min-width:0; font-size:12.5px; font-weight:700; line-height:1.5}
  .dock-s span{display:block; font-family:var(--f-num); font-weight:800; font-size:17px}
  .dock .btn{flex:none; padding:11px 16px; font-size:.98rem}
}

/* ロボット */
.robot{display:block; width:100%; height:auto; overflow:visible}
.robot text{font-family:var(--f-body); font-weight:800}
.robot .ov{mix-blend-mode:var(--blend)}
.robot .pt{transform-box:fill-box; transform-origin:50% 100%}
.robot .pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes pop{from{transform:scale(.15); opacity:0}}
.robot .bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.robot .dz{transform-box:fill-box; transform-origin:center; animation:spin 2.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.robot.busy .antb{animation:blinkant .45s steps(2) infinite}
@keyframes blinkant{50%{fill:var(--pink)}}
.robot.busy .eyes{animation:look 1.3s ease-in-out infinite}
@keyframes look{25%{transform:translateX(-3px)} 75%{transform:translateX(3px)}}
.robot.assemble .pt{animation:pop .6s cubic-bezier(.2,.9,.3,1.6) both; animation-delay:var(--d,0s)}

/* =========================================================
   モーダル
   ========================================================= */
.mwrap{position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px)); background:var(--scrim); animation:fadein .2s ease both; overflow:hidden}
.modal{width:min(600px,100%); max-height:100%; overflow-y:auto; overscroll-behavior:contain; background:var(--card); border:3px solid var(--line); box-shadow:10px 10px 0 var(--line); position:relative; animation:rise .35s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes rise{from{transform:translateY(24px) scale(.97); opacity:0}}
.m-in{padding:22px clamp(16px,4vw,28px) 24px; display:grid; gap:16px}
.m-h{font-size:clamp(1.4rem,4.4vw,1.9rem)}
.m-btns{display:flex; flex-wrap:wrap; gap:12px; margin-top:4px}
.m-btns .btn{flex:1 1 200px}

.clear-top{position:relative; display:grid; justify-items:center; text-align:center; gap:8px; padding:24px 16px 18px; border-bottom:3px solid var(--line); overflow:hidden;
  background:radial-gradient(var(--dot) 1.3px, transparent 1.5px) 0 0/12px 12px, var(--paper)}
.bigstamp{position:relative; width:150px; height:150px; display:grid; place-items:center; rotate:-11deg; animation:slam .5s cubic-bezier(.2,.9,.3,1.35) .1s both}
.bigstamp .ring{position:absolute; inset:0; border:6px double var(--ok); border-radius:50%; mix-blend-mode:var(--blend)}
.bigstamp .w{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-disp); font-size:50px; line-height:1}
.bigstamp .w0{color:var(--ok); mix-blend-mode:var(--blend)}
.bigstamp .w1{color:var(--pink); transform:translate(-3px,2px); mix-blend-mode:var(--blend); opacity:.85}
.bigstamp .w2{color:var(--blue); transform:translate(3px,-1px); mix-blend-mode:var(--blend); opacity:.7}
.bigstamp small{position:absolute; bottom:24px; font-family:var(--f-num); font-weight:800; font-size:10px; letter-spacing:.2em; color:var(--ok)}
@keyframes slam{from{transform:scale(2.6) rotate(12deg); opacity:0} 60%{opacity:1}}
.clear-t{font-size:clamp(1.25rem,4vw,1.6rem)}
.st3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; width:100%; margin-top:6px}
.st3 > div{border:2.5px solid var(--line); background:var(--card); padding:8px 6px; display:grid; justify-items:center; gap:3px; text-align:center; font-size:11.5px; font-weight:700; line-height:1.45}
.st3 .big{font-size:30px; line-height:1; color:transparent; -webkit-text-stroke:2px var(--ink-3)}
.st3 .on .big{color:var(--yellow); -webkit-text-stroke:2px var(--line); animation:starin .45s cubic-bezier(.2,.9,.3,1.8) both; animation-delay:var(--d)}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.st3 .off{opacity:.75}
.lesson{border:3px solid var(--line); background:var(--paper); padding:14px 16px 16px; display:grid; gap:6px; position:relative}
.lesson h3{font-size:1.15rem}
.lesson p{font-size:14px; line-height:1.9}
.lesson .kick{color:var(--blue)}
.lesson .tag{position:absolute; top:12px; right:12px}
.miss{font-size:13px; line-height:1.75; padding:10px 12px; border:2px solid var(--line); background:color-mix(in srgb, var(--pink) 10%, var(--card))}
.miss b{display:block; font-size:12px; color:var(--ng)}
.runs{font-size:13px; color:var(--ink-2); text-align:center}
.confetti{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.confetti i{position:absolute; top:-12px; width:9px; height:9px; mix-blend-mode:var(--blend); animation:fall var(--t) cubic-bezier(.3,.6,.5,1) var(--d) both}
@keyframes fall{to{transform:translate(var(--x),280px) rotate(var(--r)); opacity:0}}

.picker .opts{display:grid; gap:8px}
.opt{display:grid; grid-template-columns:22px minmax(0,1fr); gap:8px; align-items:start; text-align:left; border:2.5px solid var(--line); background:var(--card); padding:9px 11px; font-size:13.5px; line-height:1.65}
.opt::before{content:""; width:16px; height:16px; margin-top:3px; border:2.5px solid var(--line); border-radius:50%; background:var(--card)}
.opt[aria-pressed="true"]{background:color-mix(in srgb, var(--yellow) 40%, var(--card))}
.opt[aria-pressed="true"]::before{background:var(--pink)}
.opt[disabled]{opacity:.5; cursor:not-allowed}
.peek{border:2.5px solid var(--line); background:var(--paper)}
.peek-h{font-size:11.5px; font-weight:800; letter-spacing:.08em; padding:4px 10px; border-bottom:2px solid var(--line); background:var(--paper-2)}
.peek pre{font-family:var(--f-body); font-size:13px; line-height:1.8; padding:10px 12px; white-space:pre-wrap; word-break:break-word}

.maplist{display:grid; gap:10px}
.maplist .tile{box-shadow:4px 4px 0 var(--line)}

.minicards{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
@media (max-width:520px){.minicards{grid-template-columns:1fr}}
.minicards > div{border:2.5px solid var(--line); background:var(--paper); padding:10px 12px; font-size:13px; line-height:1.7}
.minicards b{display:block; font-family:var(--f-disp); font-weight:400; font-size:1rem; margin-top:2px}

/* 修了証 */
.cert{width:min(760px,100%)}
.cert-in{margin:12px; border:2.5px solid var(--line); outline:2.5px solid var(--line); outline-offset:-9px; padding:clamp(18px,4vw,30px); display:grid; gap:16px; position:relative; overflow:hidden;
  background:radial-gradient(var(--dot) 1.2px, transparent 1.4px) 0 0/14px 14px, var(--card)}
.cert-top{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:start}
.cert h2{font-size:clamp(2rem,7vw,3.2rem); line-height:1}
.seal{width:96px; height:96px; border:4px double var(--pink); border-radius:50%; display:grid; place-items:center; text-align:center; rotate:-14deg; font-family:var(--f-disp); font-size:12px; line-height:1.35; color:var(--pink); mix-blend-mode:var(--blend)}
.cert-body{display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:18px; align-items:center}
@media (max-width:600px){.cert-body{grid-template-columns:1fr}}
.cert-name label{display:block; font-size:12px; color:var(--ink-2); font-weight:700}
.cert-name input{width:100%; margin-top:4px; border:0; border-bottom:3px solid var(--line); background:transparent; font-family:var(--f-disp); font-size:clamp(1.3rem,4vw,1.7rem); padding:2px 0; border-radius:0}
.cert-name input::placeholder{color:var(--ink-3)}
.cert-stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:3px; background:var(--line); border:2.5px solid var(--line); margin-top:12px}
.cert-stats div{background:var(--card); padding:8px 6px; text-align:center}
.cert-stats b{display:block; font-family:var(--f-num); font-weight:800; font-size:1.45rem; line-height:1.1; color:var(--blue)}
.cert-stats small{font-size:10.5px; color:var(--ink-2)}
.cert-lessons{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px 14px; font-size:12.5px; line-height:1.6}
@media (max-width:520px){.cert-lessons{grid-template-columns:1fr}}
.cert-lessons li{display:flex; gap:7px}
.cert-lessons li span{font-family:var(--f-num); font-weight:800; color:var(--pink)}
.cert-foot{display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px; font-size:12px; color:var(--ink-2); border-top:2px solid var(--line); padding-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" data-act="sheetclose"></div>
<div id="layer"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   1. 部品のカタログ
   ===================================================================== */
const AGENT = '総務アシスタント';
const P = {
  // 指示（1行ずつ）
  i_role:   {type:'instr', tag:'役割',  label:'あなたは総務部の問い合わせ窓口です。'},
  i_cite:   {type:'instr', tag:'根拠',  label:'回答の最後に、根拠の資料名と条番号を添えてください。'},
  i_scope:  {type:'instr', tag:'範囲',  label:'総務の仕事と関係ない質問には、担当外だと伝えてください。'},
  i_tone:   {type:'instr', tag:'口調',  label:'丁寧語で、結論から簡潔に答えてください。'},
  i_emoji:  {type:'instr', tag:'キャラ', label:'絵文字をたくさん使って、楽しく答えてください。'},
  i_any:    {type:'instr', tag:'方針',  label:'どんな質問にも、できるだけ答えてあげてください。'},
  i_unknown:{type:'instr', tag:'案内',  label:'資料にないことは推測せず、総務部（内線1234）への確認を案内してください。'},
  i_secret: {type:'instr', tag:'口止め', label:'人事評価や給与については、答えないでください。'},
  // 知識
  k_shugyo: {type:'know', label:'就業規則.docx',           sub:'休暇・勤務時間のルール'},
  k_ryohi:  {type:'know', label:'旅費規程.docx',           sub:'出張の日当・宿泊費'},
  k_keihi:  {type:'know', label:'経費精算マニュアル.pdf',   sub:'精算の手順と締め切り'},
  k_shaho:  {type:'know', label:'社内報_2026夏号.pdf',      sub:'社員紹介・イベント報告'},

const TOPIC_ANS = [
  {item:'ボールペン', qty:'10本', why:'新人研修で使います', no:'B-0420'},
  {item:'マウス', qty:'1個', why:'今のが壊れたので', no:'B-0421'},
  {item:'プリンター用紙', qty:'5箱', why:'月末の印刷用です', no:'B-0422'},
];
function topicFlow(c, v){
  const a = TOPIC_ANS[v], nodes = c.topic, flow = [{act:A.topic('トピック「備品申請」を開始')}];
  const got = {}; let reg = false, err = false, all = false, doneOk = false, doneEarly = false;
  for (const id of nodes){
    if (id === 'n_item'){ flow.push({who:'b', t:'何を申請しますか？'}, {who:'u', t:a.item}); got.item = true; }
    if (id === 'n_qty'){ flow.push({who:'b', t:'いくつ必要ですか？'}, {who:'u', t:a.qty}); got.qty = true; }
    if (id === 'n_why'){ flow.push({who:'b', t:'何に使いますか？'}, {who:'u', t:a.why}); got.why = true; }
    if (id === 'n_reg'){
      if (!got.item || !got.qty){ flow.push({act:{k:'ツール', t:'備品申請リストに登録 → エラー：品名か数量が空です', bad:true}}); err = true; }
      else { flow.push({act:A.tool('t_list', `品名=${a.item}／数量=${a.qty}${got.why ? '／理由あり' : '／理由なし'}`)}); reg = true; }
    }
    if (id === 'n_done'){
      if (reg){ flow.push({who:'b', t:`申請を受け付けました。受付番号は ${a.no} です。`}); doneOk = true; }
      else { flow.push({who:'b', t:'申請を受け付けました。受付番号は「（空欄）」です。'}); doneEarly = true; }
    }
    if (id === 'n_url') flow.push({who:'b', t:'申請フォームはこちらです：intra.example/bihin'});
    if (id === 'n_all'){ flow.push({act:A.tool('t_all','宛先=全社員 1,240名')}); all = true; }
  }
  return {flow, got, reg, err, all, doneOk, doneEarly};
}
function judgeTopic(c, r){
  if (r.all) return {ok:false, why:'申請のたびに、全社員1,240名へメールが飛んだ。', hint:'「全社員にメール送信」のノードを外そう。'};
  if (r.err) return {ok:false, why:'品名や数量を聞く前に登録しようとして、エラーになった。', hint:'ツール（登録）は、質問のあとに置こう。'};
  const miss = ['n_item','n_qty','n_why'].filter(x => !c.topic.includes(x)).map(x => P[x].sub.replace('を聞く',''));
  if (miss.length) return {ok:false, why:`${miss.join('・')}を聞いていない。`, hint:'依頼のとおり「品名 → 数量 → 理由」の3つを聞こう。'};
  if (!r.reg) return {ok:false, why:'質問はしたけど、リストに登録していない。', hint:'質問のあとに、ツール「備品申請リストに登録」を置こう。'};
  const ix = id => c.topic.indexOf(id);
  if (!(ix('n_item') < ix('n_qty') && ix('n_qty') < ix('n_why') && ix('n_why') < ix('n_reg')))
    return {ok:false, why:'聞く順番が、依頼（品名 → 数量 → 理由 → 登録）とちがう。', hint:'↑↓ のボタンで並べかえよう。'};
  return {ok:true};
}

/* 網点の背景（指やマウスに反応する） */
function startDots(){
  const c = document.getElementById('dots'); if (!c) return;
  const ctx = c.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  let raf = 0, t = 0, mx = -9e3, my = -9e3, col = '', f = 0;
  const size = () => { const r = c.getBoundingClientRect(); c.width = Math.max(1, r.width * dpr); c.height = Math.max(1, r.height * dpr); };
  const draw = () => {
    const w = c.width, hh = c.height, gap = 22 * dpr, R = 160 * dpr;
    if (f++ % 40 === 0) col = getComputedStyle(document.documentElement).getPropertyValue('--dot').trim() || 'rgba(26,52,160,.24)';
    ctx.clearRect(0, 0, w, hh); ctx.fillStyle = col;
    for (let y = gap / 2; y < hh; y += gap) for (let x = gap / 2; x < w; x += gap){
      const wave = Math.sin(x * 0.011 + y * 0.015 + t) * 0.5 + 0.5;
      let r = (0.8 + wave * 1.5) * dpr;
      const d = Math.hypot(x - mx * dpr, y - my * dpr);
      if (d < R) r += (1 - d / R) * 4.4 * dpr;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    }
  };
  const loop = () => { t += 0.012; draw(); raf = requestAnimationFrame(loop); };
  const host = c.parentElement;
  const mv = e => { const r = c.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; };
  const lv = () => { mx = my = -9e3; };
  size(); draw();
  const ro = new ResizeObserver(() => { size(); draw(); }); ro.observe(c);
  if (!RM.matches){ raf = requestAnimationFrame(loop); host.addEventListener('pointermove', mv); host.addEventListener('pointerleave', lv); }
  cleanup = () => { cancelAnimationFrame(raf); ro.disconnect(); host.removeEventListener('pointermove', mv); host.removeEventListener('pointerleave', lv); cleanup = () => {}; };
}

      ${ng ? `<p class="twhy"><em>NG</em>${esc(r.why)}</p>${r.hint ? (S.hint[i] ? `<p class="thint">ヒント：${esc(r.hint)}</p>` : `<button class="hint-b" type="button" data-act="hint" data-id="${i}">ヒントを見る</button>`) : ''}` : ''}
    </div>
    <span class="tst" aria-label="${r === 'run' ? 'テスト中' : r ? (r.ok ? '合格' : '不合格') : '未テスト'}">${mark}</span>
  </div>`;
}

/* ---------- エージェントの設定 ---------- */
const UNLOCK = {instr:1, know:1, set:1, tool:4, topic:6};
function secState(key){
  const st = S.st;
  if (st.edit.includes(key)) return 'edit';
  if (st.edit.includes('desc') && (key === 'know' || key === 'tool')) return 'desc';
  return st.n >= UNLOCK[key] ? 'done' : 'future';
}
function partEditable(id){
  const st = S.st, ty = P[id].type === 'node' ? 'topic' : P[id].type;
  return st.edit.includes(ty) && !st.fixed.includes(id) && !S.running && S.runs > 0;
}
const xBtn = (id, label) => {
  const st = S.st, ty = P[id].type === 'node' ? 'topic' : P[id].type;
  if (!st.edit.includes(ty) || st.fixed.includes(id)) return '<span></span>';
  return `<button class="x" type="button" data-act="rm" data-id="${id}" aria-label="「${esc(label)}」を外す" ${partEditable(id) ? '' : 'disabled'}>×</button>`;
};
const docIcon = (danger) => `<svg class="ico" viewBox="0 0 26 30" aria-hidden="true"><path d="M3 2h14l6 6v20H3z" fill="${danger ? 'var(--pink)' : 'var(--paper)'}" stroke="var(--line)" stroke-width="2"/><path d="M17 2v6h6" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M7 14h12M7 18h12M7 22h8" stroke="var(--line)" stroke-width="1.6"/></svg>`;
const plugIcon = (danger) => `<svg class="ico" viewBox="0 0 26 30" aria-hidden="true"><rect x="3" y="9" width="20" height="14" rx="3" fill="${danger ? 'var(--pink)' : 'var(--yellow)'}" stroke="var(--line)" stroke-width="2"/><path d="M9 3v6M17 3v6M13 23v5" stroke="var(--line)" stroke-width="2.4" stroke-linecap="round"/></svg>`;

function renderEditor(){
  const st = S.st, c = S.cfg, el = $('#editor'); if (!el) return;
  const status = S.running ? '<span class="pill run">テスト中…</span>'
    : S.lastPass && !S.dirty ? '<span class="pill ok">合格</span>'
    : S.runs ? `<span class="pill ng">${S.dirty ? '設定を変更（未テスト）' : '直すところあり'}</span>` : '<span class="pill">作りかけ（未テスト）</span>';
  el.innerHTML = `
    <div class="ed-head">
      <div id="robot"></div>
      <div class="ed-name"><span class="kick">AGENT</span><h3>${AGENT}</h3>
        <div class="ed-status">${status}${S.runs ? `<span class="pill">テスト ${S.runs}回</span>` : ''}</div></div>
    </div>
    <div class="secs">${['instr','know','set','tool','topic'].map(secHTML).join('')}</div>`;
  mountRobot($('#robot'), c, {tags:st.n >= 5, busy:S.running, label:robotLabel(c)});
}
function robotLabel(c){
  return `いまのエージェント：指示${c.instr.length}行、知識${c.know.length}件、ツール${c.tools.length}個${c.topic.length ? '、トピックあり' : ''}${c.gk ? '、一般知識オン' : ''}`;
}
function secHead(key, state){
  const ty = TY[key];
  const right = state === 'edit' ? '<span class="sec-flag">ここを直す</span>'
    : state === 'desc' ? '<span class="sec-flag">説明を直す</span>'
    : state === 'future' ? `<span class="sec-lock">依頼${pad(UNLOCK[key])}で使えるようになります</span>`
    : (key === 'set' && S.st.n < 3) ? '<span class="sec-lock">初期設定のまま（依頼03で扱います）</span>'
    : '<span class="sec-lock">設定ずみ</span>';
  return `<div class="sec-h"><span class="tag ${ty.cls}">${ty.name}</span><span class="sec-en">${ty.en}</span>${right}</div>`;
}
function secHTML(key){
  const c = S.cfg, state = secState(key);
  const head = secHead(key, state);
  if (state === 'future') return `<div class="sec-x s-future">${head}</div>`;
  let body = '';
  if (key === 'instr'){
    if (!c.instr.length) body = '<p class="empty">まだ何も書かれていません。</p>';
    else if (state === 'edit') body = `<ol class="lines">${c.instr.map((id, i) => `<li class="line"><span class="line-no">${i + 1}</span><span class="line-tag">${esc(P[id].tag)}</span><span>${esc(P[id].label)}</span>${xBtn(id, P[id].label)}</li>`).join('')}</ol>`;
    else body = `<div class="chipline">${c.instr.map(id => `<span class="mini" title="${esc(P[id].label)}">${esc(P[id].tag)}</span>`).join('')}</div>`;
  }
  if (key === 'know'){
    if (state === 'desc') body = descItems(c.know, 'know');
    else if (!c.know.length) body = '<p class="empty">資料がありません。</p>';
    else if (state === 'edit') body = `<div class="items">${c.know.map(id => itemHTML(id, docIcon(P[id].danger))).join('')}</div>`;
    else body = `<div class="chipline">${c.know.map(id => `<span class="mini${P[id].danger ? ' danger' : ''}">${esc(P[id].label)}</span>`).join('')}</div>`;
  }
  if (key === 'set'){
    const dis = state !== 'edit' || S.running || S.runs === 0 ? 'disabled' : '';
    body = `<div>
      <div class="sw-row"><div><b>AIの一般知識を使う</b><small>資料にないことも、AIがもともと知っていることで答える</small></div><span><span class="sw-l">${c.gk ? 'ON' : 'OFF'}</span><button class="sw" type="button" role="switch" aria-checked="${c.gk}" aria-label="AIの一般知識を使う" data-act="toggle" data-id="gk" ${dis}></button></span></div>
      <div class="sw-row"><div><b>Web検索を使う</b><small>社外のWebサイトを調べて答える</small></div><span><span class="sw-l">${c.web ? 'ON' : 'OFF'}</span><button class="sw" type="button" role="switch" aria-checked="${c.web}" aria-label="Web検索を使う" data-act="toggle" data-id="web" ${dis}></button></span></div>
    </div>`;
  }
  if (key === 'tool'){
    if (state === 'desc') body = descItems(c.tools, 'tool');
    else if (!c.tools.length) body = '<p class="empty">まだ道具を持っていません。</p>';
    else if (state === 'edit') body = `<div class="items">${c.tools.map(id => itemHTML(id, plugIcon(P[id].danger))).join('')}</div>`;
    else body = `<div class="chipline">${c.tools.map(id => `<span class="mini${P[id].danger ? ' danger' : ''}">${esc(P[id].label)}</span>`).join('')}</div>`;
  }
  if (key === 'topic'){
    if (state === 'edit'){
      body = `<div class="flow"><div class="trig"><b>トピック「備品申請」</b>　トリガー：備品を申請したいと言われたとき</div>
        ${c.topic.length ? c.topic.map((id, i) => `<div class="arrow"></div><div class="node"><span class="tag t-node">${esc(P[id].tag)}</span><div><b>${esc(P[id].label)}</b><small>${esc(P[id].sub)}</small></div>
          <div class="node-c"><button class="x" type="button" data-act="up" data-id="${id}" aria-label="上へ" ${i === 0 ? 'disabled' : ''}>↑</button><button class="x" type="button" data-act="down" data-id="${id}" aria-label="下へ" ${i === c.topic.length - 1 ? 'disabled' : ''}>↓</button>${xBtn(id, P[id].label)}</div></div>`).join('')
          : '<div class="arrow"></div><p class="empty">ノードがありません。トレイから、上から順に追加しよう。</p>'}</div>`;
    } else body = c.topic.length ? `<div class="chipline"><span class="mini">備品申請（${c.topic.length}ノード）</span></div>` : '<p class="empty">トピックはありません。</p>';
  }
  return `<div class="sec-x s-${state}">${head}${body}</div>`;
}
function itemHTML(id, icon){
  const p = P[id];
  return `<div class="item${p.danger ? ' danger' : ''}">${icon}<div><b>${esc(p.label)}</b><small>${esc(p.sub)}</small></div>${xBtn(id, p.label)}</div>`;
}
function descItems(ids, ty){
  const c = S.cfg;
  const edit = ids.filter(id => id in TRUTH), rest = ids.filter(id => !(id in TRUTH));
  return `<div class="ditems">${edit.map(id => {
    const d = c.desc[id], cls = d ? (DESC[d].vague ? 'vague' : 'set') : '';
    return `<div class="ditem"><div class="ditem-top">${ty === 'know' ? docIcon() : plugIcon()}<b>${esc(P[id].label)}</b></div>
      <button class="desc-b ${cls}" type="button" data-act="desc" data-id="${id}"><span>説明：</span>${d ? esc(DESC[d].label) : '（なし）'}　▾</button></div>`;
  }).join('')}</div>
  <div class="chipline" style="margin-top:8px">${rest.map(id => `<span class="mini" title="説明あり">${esc(P[id].label)}</span>`).join('')}<span class="mini" style="border-style:dashed">↑ ほかは説明ずみ</span></div>`;
}

/* ---------- 部品トレイ ---------- */
function renderTray(){
  const st = S.st, c = S.cfg, el = $('#tray'); if (!el) return;
  const placed = new Set([...c.instr, ...c.know, ...c.tools, ...c.topic]);
  const avail = st.pool.filter(id => !placed.has(id) && !st.fixed.includes(id));
  const locked = S.runs === 0;
  let body;
  if (st.key === 'desc') body = '<p class="tray-none">今回はトレイを使いません。上の「知識」と「ツール」で、<b>説明：</b>の欄をタップしてください。中身をのぞいてから、合うラベルを選べます。</p>';
  else if (!avail.length) body = '<p class="tray-none">トレイは空です。設定の中の × で外した部品は、ここに戻ります。</p>';
  else body = `<div class="parts">${avail.map(id => {
    const p = P[id], ty = p.type, tyName = ty === 'node' ? p.tag : TY[ty].name;
    return `<button class="part${p.danger ? ' danger' : ''}" type="button" data-act="add" data-id="${id}"><span class="tag ${TY[ty].cls}">${esc(tyName)}</span><span class="part-t"><b>${esc(p.label)}</b>${p.sub ? `<small>${esc(p.sub)}</small>` : (p.tag && ty === 'instr' ? `<small>${esc(p.tag)}</small>` : '')}</span><span class="part-plus" aria-hidden="true">＋</span></button>`;
  }).join('')}</div>`;
  el.className = 'card tray' + (locked && st.key !== 'desc' ? ' locked' : '');
  el.innerHTML = `<div class="card-h"><h3>部品トレイ</h3><small>${st.key === 'topic' ? 'タップでトピックの最後に追加。↑↓ で並べかえ' : 'タップで追加。設定の中の × で外す'}</small></div>
    <div class="tray-b">${body}</div>
    ${locked && st.key !== 'desc' ? `<div class="tray-lock"><div>まずは今のまま、テストしてみよう。<span>どこがダメかを見てから直すのが、エージェントづくりの基本です。${mobile() ? '下の' : '右の'}「テスト」ボタンからどうぞ。</span></div></div>` : ''}`;
}

/* ---------- テストパネル ---------- */
function renderTP(){
  const el = $('#tp'); if (!el) return;
  el.innerHTML = `
    <div class="tp-h"><span class="tp-dot"></span><b>テスト</b><span class="tp-sess" id="tpSess">${S.runs ? `テスト ${S.runs}回目` : 'まだテストしていません'}</span><button class="tp-close" type="button" data-act="sheetclose">設定にもどる</button></div>
    <div class="tp-log" id="log" aria-live="polite">
      <div class="tp-empty">${robotSVG(S.cfg, {label:'テストを待っているエージェント'})}<p>テスト項目の質問を、順番にエージェントへ送ります。<br>AIがどの資料を読んだか、どの道具を使ったかも見えます。</p></div>
    </div>
    <div class="tp-foot" id="tpFoot"></div>`;
  renderTPFoot();
}
function testLabel(){ return S.running ? '早送り ≫' : S.runs === 0 ? 'まずは今のままテスト ▶' : 'もう一度テスト ▶'; }
function renderTPFoot(sum){
  const el = $('#tpFoot'); if (!el) return;
  el.innerHTML = `${sum || ''}<button class="btn ${S.running ? 'ghost' : 'blue'}${S.runs === 0 && !S.running ? ' pulse' : ''}" type="button" data-act="${S.running ? 'ff' : 'test'}">${testLabel()}</button>`;
  $('#tp').classList.toggle('running', S.running);
}
function renderDock(){
  const el = $('#dock'); if (!el) return;
  const n = S.st.tests.length, ok = S.res.filter(r => r && r !== 'run' && r.ok).length;
  const s = S.running ? '<span>…</span>テスト中' : S.runs === 0 ? '<span>未テスト</span>まずは今のまま試そう' : S.dirty ? `<span>${ok} / ${n}</span>設定を変えました。もう一度テスト` : `<span>${ok} / ${n} 合格</span>${ok === n ? 'クリア！' : '✗の理由を見て直そう'}`;
  el.innerHTML = `<div class="dock-s">${s}</div><button class="btn ${S.running ? 'ghost' : 'blue'}${S.runs === 0 && !S.running ? ' pulse' : ''}" type="button" data-act="${S.running ? 'sheetopen' : 'test'}">${S.running ? 'テストを見る' : testLabel()}</button>`;
}

/* ---------- 設定の変更 ---------- */
function changed(){
  if (S.runs) S.dirty = true;
  renderEditor(); renderTray(); renderDock();
  const tr = document.querySelector('.trows'); if (tr) tr.classList.toggle('stale', S.dirty);
}
function listOf(id){ const t = P[id].type; return t === 'instr' ? S.cfg.instr : t === 'know' ? S.cfg.know : t === 'tool' ? S.cfg.tools : S.cfg.topic; }
function addPart(id){
  if (S.running) return;
  if (S.runs === 0){ const t = $('#tray'); t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); return; }
  if (!partEditable(id)) return;
  const l = listOf(id); if (!l.includes(id)) l.push(id);
  changed();
}
function rmPart(id){ if (!partEditable(id)) return; const l = listOf(id), i = l.indexOf(id); if (i >= 0) l.splice(i, 1); changed(); }
function movePart(id, d){ if (S.running || S.runs === 0) return; const l = S.cfg.topic, i = l.indexOf(id), j = i + d; if (i < 0 || j < 0 || j >= l.length) return; [l[i], l[j]] = [l[j], l[i]]; changed(); }

/* =====================================================================
   7. テストの実行
   ===================================================================== */
function scrollLog(){ const l = $('#log'); if (l) l.scrollTop = l.scrollHeight; }
function el(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
async function typeInto(node, text){
  if (S.ff || RM.matches){ node.textContent = text; return; }
  node.classList.add('typing');
  for (let i = 1; i <= text.length; i += 2){
    if (S.ff) break;
    node.textContent = text.slice(0, i); scrollLog();
    await new Promise(r => setTimeout(r, 15));
  }
  node.textContent = text; node.classList.remove('typing');
}
function toFlow(r){
  if (r.flow) return r.flow;
  return [...(r.steps || []).map(s => ({act:s})), {who:'b', t:r.a, cite:r.cite}];
}
async function playCase(log, t, r, label, isBonus){
  const box = el('div', 'case');
  box.appendChild(el('div', 'case-h', `<span class="${isBonus ? 'bonus' : ''}">${esc(label)}</span><em>期待：${esc(t.exp)}</em>`));
  log.appendChild(box); scrollLog();
  const u = el('div', 'msg u'); u.textContent = t.q.replace(/（[12]回目）$/, ''); box.appendChild(u); scrollLog();
  await sleep(380);
  let acts = null;
  for (const it of toFlow(r)){
    if (it.act){
      if (!acts){ acts = el('div', 'acts'); box.appendChild(acts); }
      acts.appendChild(el('div', 'act' + (it.act.bad ? ' bad' : ''), `<i>${esc(it.act.k)}</i><span>${esc(it.act.t)}</span>`));
      scrollLog(); await sleep(330);
    } else {
      acts = null;
      const m = el('div', 'msg ' + (it.who === 'u' ? 'u' : 'b') + (it.ghost ? ' ghost' : ''));
      box.appendChild(m);
      if (it.who === 'u'){ m.textContent = it.t; await sleep(260); }
      else { await typeInto(m, it.t); }
      if (it.cite){ box.appendChild(el('div', 'cite', `参照　${esc(it.cite)}`)); }
      scrollLog(); await sleep(it.who === 'u' ? 200 : 260);
    }
  }
  const j = el('div', 'judge', `<span class="stamp ${r.ok ? 'ok' : 'ng'}">${r.ok ? '合格' : 'NG'}</span><p>${r.ok ? '期待どおり。' : esc(r.why)}</p>`);
  box.appendChild(j); scrollLog();
  await sleep(520);
}
function setRow(i, r, isBonus){
  const row = document.querySelector(`.trow[data-row="${i}"]`);
  if (!row){ renderBrief(); return; }
  const t = isBonus ? S.st.bonus : S.st.tests[i];
  row.outerHTML = rowHTML(t, i, r, isBonus);
}
async function runTests(){
  if (S.running) return;
  const st = S.st, cfg = clone(S.cfg);
  S.running = true; S.ff = false; S.runs++; S.dirty = false; S.hint = {}; S.lastPass = false;
  S.res = st.tests.map(() => null);
  if (S.bonusSeen) S.bonus = null;
  document.body.classList.add('running');
  if (mobile()) openSheet();
  renderBrief(); renderEditor(); renderTray(); renderTPFoot(); renderDock();
  $('#tpSess').textContent = `テスト ${S.runs}回目`;
  const log = $('#log');
  log.innerHTML = `<div class="sess">新しいテストセッション ・ テスト ${S.runs}回目</div>`;
  for (let i = 0; i < st.tests.length; i++){
    S.res[i] = 'run'; setRow(i, 'run');
    const r = st.tests[i].run(cfg);
    await playCase(log, st.tests[i], r, `TEST ${i + 1}`);
    S.res[i] = r; setRow(i, r);
  }
  const pass = S.res.every(r => r.ok);
  let b = null;
  if (pass){
    S.bonusSeen = true; S.bonus = 'run'; renderBrief();
    log.appendChild(el('div', 'sess', 'テスト項目は全部合格。おまけの意地悪な質問を送ります'));
    await sleep(500);
    b = st.bonus.run(cfg);
    await playCase(log, st.bonus, b, 'おまけ', true);
    S.bonus = b; setRow('b', b, true);
  }
  S.running = false; S.ff = false; S.lastPass = pass;
  document.body.classList.remove('running');
  const ok = S.res.filter(r => r.ok).length;
  renderTPFoot(`<p class="sumline"><span>${ok} / ${st.tests.length}</span>${pass ? '合格！' : '✗の項目の理由を見て、設定を直そう。'}</p>`);
  renderEditor(); renderTray(); renderDock();
  if (pass){ await sleep(RM.matches ? 0 : 450); showClear(cfg, b); }
}
function openSheet(){ document.body.classList.add('sheet'); }
function closeSheet(){ document.body.classList.remove('sheet'); }

/* =====================================================================
   8. クリア・チェックポイント・修了証
   ===================================================================== */
function junkOf(st, cfg){
  if (st.junkOf) return st.junkOf(cfg);
  const all = [...cfg.instr, ...cfg.know, ...cfg.tools, ...cfg.topic];
  return st.junk.filter(id => all.includes(id)).map(id => P[id].type === 'instr' ? `指示「${P[id].label}」` : P[id].type === 'node' ? `ノード「${P[id].label}」` : P[id].label);
}
function confetti(){
  if (RM.matches) return '';
  const cols = ['var(--pink)','var(--blue)','var(--yellow)','var(--green)'];
  let s = '';
  for (let i = 0; i < 34; i++){
    const x = Math.round(Math.random() * 100), dx = Math.round((Math.random() - .5) * 120);
    s += `<i style="left:${x}%;background:${cols[i % 4]};--x:${dx}px;--r:${Math.round(Math.random() * 720 - 360)}deg;--t:${(1.4 + Math.random() * 1.2).toFixed(2)}s;--d:${(Math.random() * .5).toFixed(2)}s;${i % 3 === 0 ? 'border-radius:50%;' : ''}${i % 4 === 1 ? 'width:5px;height:13px;' : ''}"></i>`;
  }
  return `<div class="confetti" aria-hidden="true">${s}</div>`;
}
function showClear(cfg, b){
  const st = S.st, junk = junkOf(st, cfg);
  const earned = [true, !!(b && b.ok), junk.length === 0];
  const prev = starsOf(st.n);
  prog.stars[st.n] = prev.map((v, i) => v || earned[i]);
  prog.open = Math.max(prog.open, Math.min(7, st.n + 1));
  save();
  const bs = $('#barStars'); if (bs) bs.innerHTML = starsHTML(starsOf(st.n));
  const labels = ['テスト合格', '意地悪な質問もOK', 'ムダな部品なし'];
  const notes = [];
  if (b && !b.ok) notes.push(`<div class="miss"><b>意地悪な質問で NG</b>「${esc(st.bonus.q)}」<br>${esc(b.why)}<br>ヒント：${esc(b.hint || '')}</div>`);
  if (junk.length) notes.push(`<div class="miss"><b>ムダ・危ない部品が入っています</b>${junk.map(esc).join('、')}</div>`);
  const last = st.n === 7;
  openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="clearT">
    <div class="clear-top">${confetti()}
      <div class="bigstamp" aria-hidden="true"><div class="ring"></div><div class="w w1">合格</div><div class="w w2">合格</div><div class="w w0">合格</div><small>PASSED</small></div>
      <h2 class="clear-t" id="clearT">依頼${pad(st.n)}　クリア</h2>
      <div class="st3">${earned.map((on, i) => `<div class="${on ? 'on' : 'off'}" style="--d:${0.45 + i * 0.18}s"><span class="big" aria-hidden="true">★</span>${labels[i]}<span class="sr">${on ? '獲得' : '未獲得'}</span></div>`).join('')}</div>
    </div>
    <div class="m-in">
      ${notes.join('')}
      <div class="lesson"><span class="kick">学び ${pad(st.n)}</span><span class="tag ${tagCls(st)}">${esc(st.concept)}</span><h3>${esc(st.lesson.t)}</h3><p>${esc(st.lesson.b)}</p></div>
      <p class="runs">作る → 試す → 直す を、${S.runs}回まわして合格しました。</p>
      <div class="m-btns">
        <button class="btn" type="button" data-act="next">${last ? '修了証を受け取る' : st.n === 2 ? '講義パートを終える' : `次の依頼へ（依頼${pad(st.n + 1)}）`}</button>
        ${earned.every(Boolean) ? '' : '<button class="btn ghost" type="button" data-act="retry">★を取りに、もう一度直す</button>'}
      </div>
    </div></div>`);
}
function showCheckpoint(){
  openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="cpT"><div class="m-in">
    <span class="kick">講義パート クリア</span>
    <h2 class="m-h" id="cpT">エージェントの土台ができました</h2>
    <p>おつかれさまでした。いま育てたエージェントは、指示どおりにふるまい、渡した資料をもとに根拠つきで答えます。Copilot Studio のハンズオンで作るものと、同じ形です。</p>
    <div class="minicards">${[ST[0], ST[1]].map(st => `<div><span class="kick">学び ${pad(st.n)}</span><b>${esc(st.lesson.t)}</b></div>`).join('')}</div>
    <p style="font-size:13.5px;color:var(--ink-2)">残り5つの依頼（一般知識、ツール、説明、トピック、公開前チェック）は、時間のあるときにどうぞ。進み具合はこのブラウザに保存されます。</p>
    <div class="m-btns"><button class="btn" type="button" data-act="stage" data-id="3">続けて依頼03へ</button><button class="btn ghost" type="button" data-act="home">依頼一覧へ</button></div>
  </div></div>`);
}
function showCert(){
  const total = ST.reduce((a, st) => a + starCount(st.n), 0);
  const d = new Date(), date = `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
  openModal(`<div class="modal cert" role="dialog" aria-modal="true" aria-labelledby="certT"><div class="cert-in">
    <div class="cert-top"><div><span class="kick">CERTIFICATE ／ エージェント工房</span><h2 id="certT" style="margin-top:6px">修了証</h2></div><div class="seal" aria-hidden="true">工房<br>認定</div></div>
    <div class="cert-body">
      <div>${robotSVG(FULL, {assemble:true, tags:true, label:'育てあげたエージェント'})}</div>
      <div>
        <div class="cert-name"><label for="cert-name">あなたの名前</label><input id="cert-name" type="text" maxlength="24" placeholder="名前を入れてください" value="${esc(prog.name || '')}" autocomplete="off"></div>
        <p style="margin-top:12px;font-size:14px;line-height:1.9">あなたは7つの依頼をこなし、<b>${AGENT}</b>を公開できる状態まで育てあげました。</p>
        <div class="cert-stats"><div><b class="num">${FULL.instr.length}</b><small>指示の行</small></div><div><b class="num">${FULL.know.length}</b><small>知識</small></div><div><b class="num">${FULL.tools.length}</b><small>ツール</small></div><div><b class="num">${total}</b><small>★ / 21</small></div></div>
      </div>
    </div>
    <ol class="cert-lessons">${ST.map(st => `<li><span>${pad(st.n)}</span>${esc(st.lesson.t)}</li>`).join('')}</ol>
    <div class="cert-foot"><span>${date}</span><span>作る → 試す → 直す</span></div>
  </div>
  <div class="m-in" style="padding-top:4px"><div class="m-btns"><button class="btn" type="button" data-act="home">タイトルへ</button><button class="btn ghost" type="button" data-act="reset" id="resetBtn">記録を消して最初から</button></div></div>
  </div>`);
}
function showMap(){
  openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mapT"><div class="m-in">
    <span class="kick">REQUESTS</span><h2 class="m-h" id="mapT">依頼一覧</h2>
    <div class="maplist">${ST.map(tileHTML).join('')}</div>
    <div class="m-btns"><button class="btn ghost" type="button" data-act="home">タイトルへ</button><button class="btn ghost" type="button" data-act="close">閉じる</button></div>
  </div></div>`);
}
function showPicker(id){
  if (S.running) return;
  const ty = P[id].type, cur = S.cfg.desc[id] || '', dis = S.runs === 0 ? 'disabled' : '';
  const opts = Object.entries(DESC).filter(([, d]) => d.for === ty);
  openModal(`<div class="modal picker" role="dialog" aria-modal="true" aria-labelledby="pkT"><div class="m-in">
    <span class="kick">説明（ラベル）をえらぶ</span><h2 class="m-h" id="pkT">${esc(P[id].label)}</h2>
    <div class="peek"><div class="peek-h">中身をのぞく</div><pre>${esc(PEEK[id])}</pre></div>
    ${dis ? '<p class="miss"><b>まずは今のままテスト</b>どの質問で、AIがどれを選びまちがえるかを見てから、ラベルを貼りかえよう。中身は今のうちにのぞいておけます。</p>' : ''}
    <div class="opts">${opts.map(([k, d]) => `<button class="opt" type="button" aria-pressed="${cur === k}" data-act="setdesc" data-id="${id}" data-v="${k}" ${dis}><span>${esc(d.label)}</span></button>`).join('')}
      <button class="opt" type="button" aria-pressed="${!cur}" data-act="setdesc" data-id="${id}" data-v="" ${dis}><span>（説明なし）</span></button></div>
    <button class="btn sm ghost" type="button" data-act="close">閉じる</button>
  </div></div>`);
}
let lastFocus = null;
function openModal(html){
  lastFocus = document.activeElement;
  layer.innerHTML = `<div class="mwrap" data-act="scrim">${html}</div>`;
  const f = layer.querySelector('.btn, button, input'); if (f) f.focus({preventScroll:true});
}
function closeModal(){
  if (!layer.innerHTML) return;
  layer.innerHTML = '';
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}

/* =====================================================================
   9. 操作
   ===================================================================== */
const ACT = {
  home(){ closeModal(); renderTitle(); scrollTo(0, 0); },
  stage(id){ const n = +id; if (n > prog.open) return; startStage(n); },
  map(){ showMap(); },
  close(){ closeModal(); },
  scrim(id, b, e){ if (e.target === b && !b.querySelector('.cert')) closeModal(); },
  unlockall(){ prog.open = 7; save(); renderTitle(); const r = $('#requests'); if (r) r.scrollIntoView(); },
  add(id){ addPart(id); },
  rm(id){ rmPart(id); },
  up(id){ movePart(id, -1); },
  down(id){ movePart(id, 1); },
  toggle(id){ if (S.running || S.runs === 0 || !S.st.edit.includes('set')) return; S.cfg[id] = !S.cfg[id]; changed(); },
  test(){ runTests(); },
  ff(){ S.ff = true; },
  hint(id){ S.hint[id] = true; renderBrief(); },
  sheetopen(){ openSheet(); },
  sheetclose(){ closeSheet(); },
  desc(id){ showPicker(id); },
  setdesc(id, b){ if (S.running || S.runs === 0) return; S.cfg.desc[id] = b.dataset.v || null; closeModal(); changed(); },
  next(){
    const n = S.st.n; closeModal(); closeSheet();
    if (n === 2) showCheckpoint();
    else if (n === 7){ renderTitle(); showCert(); }
    else startStage(n + 1);
  },
  retry(){ closeModal(); closeSheet(); $('#editor').scrollIntoView({behavior:RM.matches ? 'auto' : 'smooth', block:'start'}); },
  cert(){ showCert(); },
  reset(id, b){
    if (b.dataset.armed){ prog = {stars:{}, open:1, name:''}; save(); closeModal(); renderTitle(); scrollTo(0, 0); return; }
    b.dataset.armed = '1'; b.textContent = 'もう一度押すと、記録を消します';
  },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  if (b.tagName === 'A') e.preventDefault();
  f(b.dataset.id, b, e);
});
document.addEventListener('input', e => { if (e.target.id === 'cert-name'){ prog.name = e.target.value; save(); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (layer.innerHTML) closeModal(); else if (document.body.classList.contains('sheet')) closeSheet();
});
// タイトルの「依頼をえらぶ」はページ内リンク
document.addEventListener('click', e => {
  const a = e.target.closest('a[href="#requests"]'); if (!a) return;
  e.preventDefault(); const r = $('#requests'); if (r) r.scrollIntoView({behavior:RM.matches ? 'auto' : 'smooth'});
});

/* =====================================================================
   10. 起動
   ===================================================================== */
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({prog, n:S.view === 'play' && S.st ? S.st.n : 0, cfg:S.cfg}));
const boot = d => {
  if (d && d.prog) prog = Object.assign(prog, d.prog);
  if (d && d.n && ST[d.n - 1]) startStage(d.n, d.cfg); else renderTitle();
};
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
window.__agentKoubou = {S, ST, P, get prog(){ return prog; }};
})();
</script>
</body>
</html>
