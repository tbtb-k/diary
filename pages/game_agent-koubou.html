<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>エージェント工房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="社員からの依頼にこたえて、AIエージェントを1体育てる学習ゲーム。テストして、失敗を見て、直す。Copilot Studio の考え方を体験します。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* レイアウト：1画面1ステップ。上に「依頼を読む → テストする → 直す」の道しるべ、下に次へ進むボタン。
   読みやすさ優先（UDフォント・本文16px以上・色は落ち着いた青1色＋合格の緑・NGの赤）。 */
:root{
  color-scheme: light;
  --bg:#f3f5f8;   --card:#ffffff;  --sub:#eef2f7;  --line:#d5dbe4; --line-2:#aeb8c6;
  --text:#1c2333; --text-2:#465064; --text-3:#6f7889;
  --accent:#2357c4; --accent-h:#1b469f; --accent-2:#e7eefc; --on-accent:#ffffff;
  --ok:#1d7f46;   --ok-bg:#e5f4eb; --ng:#bf3030;  --ng-bg:#fcebeb;
  --hint:#7a5a00; --hint-bg:#fff5d6; --hint-line:#ecd07a;
  --star:#f0a81a; --star-off:#cdd3dd; --scrim:rgba(18,24,38,.5);
  --r-line:#26314b; --r-head:#3f71e0; --r-body:#bcd0f7; --r-face:#ffffff; --r-badge:#ffd65a;
  --r-b1:#7aa2f7; --r-b2:#6cc6a0; --r-b3:#f2b56b; --r-b4:#c9ced8; --r-danger:#e05656; --r-shadow:rgba(30,40,70,.12);
  --f:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#141922;   --card:#1c2330;  --sub:#232c3b;  --line:#334055; --line-2:#4b5a72;
    --text:#edf0f5; --text-2:#bcc4d3; --text-3:#8f99ac;
    --accent:#7fa6ff; --accent-h:#a3c0ff; --accent-2:#22314f; --on-accent:#0f1624;
    --ok:#62d394;   --ok-bg:#173525; --ng:#ff8f8f;  --ng-bg:#3b1f23;
    --hint:#f3d27a; --hint-bg:#352d18; --hint-line:#6f5c26;
    --star:#f5b833; --star-off:#4a556a; --scrim:rgba(4,7,14,.66);
    --r-line:#e3e8f2; --r-head:#5f8cff; --r-body:#2f4778; --r-face:#e9eef8; --r-badge:#ffd65a;
    --r-b1:#5f86e0; --r-b2:#3fa57a; --r-b3:#d49447; --r-b4:#7d889c; --r-danger:#e46464; --r-shadow:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#141922;   --card:#1c2330;  --sub:#232c3b;  --line:#334055; --line-2:#4b5a72;
  --text:#edf0f5; --text-2:#bcc4d3; --text-3:#8f99ac;
  --accent:#7fa6ff; --accent-h:#a3c0ff; --accent-2:#22314f; --on-accent:#0f1624;
  --ok:#62d394;   --ok-bg:#173525; --ng:#ff8f8f;  --ng-bg:#3b1f23;
  --hint:#f3d27a; --hint-bg:#352d18; --hint-line:#6f5c26;
  --star:#f5b833; --star-off:#4a556a; --scrim:rgba(4,7,14,.66);
  --r-line:#e3e8f2; --r-head:#5f8cff; --r-body:#2f4778; --r-face:#e9eef8; --r-badge:#ffd65a;
  --r-b1:#5f86e0; --r-b2:#3fa57a; --r-b3:#d49447; --r-b4:#7d889c; --r-danger:#e46464; --r-shadow:rgba(0,0,0,.35);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--f); font-size:16px; line-height:1.8; overflow-x:clip}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:90; background:var(--card)}
h1,h2,h3{margin:0; font-weight:700; line-height:1.4; text-wrap:balance; word-break:auto-phrase}
p,ul,ol,dl,dd,pre{margin:0}
ul,ol{padding:0; list-style:none}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important; animation-delay:0s!important; transition-duration:.01ms!important; scroll-behavior:auto!important}}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--text-2); font-size:15px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ボタン */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:12px 24px; border-radius:10px; border:2px solid transparent; font-size:17px; font-weight:700; line-height:1.3; text-align:center; text-decoration:none; transition:background .15s, border-color .15s, transform .1s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent); color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-h)}
.btn.second{background:var(--card); color:var(--accent); border-color:var(--line-2)}
.btn.second:hover{border-color:var(--accent)}
.btn.danger{background:var(--ng); color:var(--card)}
.btn.danger:hover{filter:brightness(.92)}
.t-tools{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-top:16px; padding-top:16px; border-top:1px solid var(--line)}
.t-tools .btn{min-height:44px; padding:8px 16px; font-size:15px}
.flash{margin-top:14px; padding:10px 14px; border-radius:10px; background:var(--ok-bg); color:var(--ok); font-size:15px; font-weight:700}
.dotlist{display:grid; gap:4px; font-size:16px; line-height:1.7}
.dotlist li::before{content:"・"}
.reset-row{margin-top:14px; text-align:right}
.btn.big{min-height:60px; font-size:19px; padding:14px 34px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.link{border:0; background:none; padding:6px 2px; color:var(--accent); font-size:15px; text-decoration:underline; text-underline-offset:3px}

.pill{display:inline-flex; align-items:center; font-size:14px; font-weight:700; line-height:1.4; padding:3px 12px; border-radius:999px; background:var(--accent-2); color:var(--accent); white-space:nowrap}
.pill.lec{background:var(--hint-bg); color:var(--hint)}
.stars{display:inline-flex; gap:1px; font-size:18px; line-height:1; color:var(--star-off); white-space:nowrap}
.stars .on{color:var(--star)}

.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px clamp(16px,3.5vw,26px)}
.card + .card{margin-top:16px}
.card h2{font-size:19px}
.card > .muted{margin-top:4px}

/* =========================================================
   タイトル
   ========================================================= */
.t-hero{background:var(--card); border-bottom:1px solid var(--line)}
.t-in{max-width:1000px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr); gap:16px 32px; align-items:center; padding-block:clamp(28px,6vw,64px)}
@media (max-width:760px){.t-in{grid-template-columns:1fr}}
.t-kick{font-size:15px; font-weight:700; color:var(--accent)}
.t-in h1{font-size:clamp(34px,7vw,52px); line-height:1.2; margin-top:6px}
.t-lead{margin-top:16px; font-size:17px; line-height:1.95}
.t-btns{display:flex; flex-wrap:wrap; gap:12px; margin-top:24px}
.t-note{margin-top:14px; font-size:15px; color:var(--text-2)}
.t-robot{max-width:360px; width:100%; justify-self:center}
@media (max-width:760px){.t-robot{max-width:280px; order:-1}}
.t-sec{max-width:1000px; margin:0 auto; padding-block:clamp(28px,5vw,44px) 0}
.t-sec > h2{font-size:22px}
.t-sec > .muted{margin-top:6px}
.how{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:16px}
@media (max-width:760px){.how{grid-template-columns:1fr}}
.how li{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px}
.how-n{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--accent); color:var(--on-accent); font-weight:700}
.how h3{font-size:18px; margin-top:10px}
.how p{font-size:15px; color:var(--text-2); margin-top:6px; line-height:1.8}
.starrule{display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:16px; font-size:15px; color:var(--text-2)}
.starrule span{display:inline-flex; gap:6px; align-items:center}
.starrule b{color:var(--star); font-size:18px}
.reqlist{display:grid; gap:10px; margin-top:16px}
.req-row{width:100%; display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:14px; align-items:center; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; transition:border-color .15s, box-shadow .15s}
.req-row:hover{border-color:var(--accent); box-shadow:0 2px 10px var(--r-shadow)}
.req-row[disabled]{cursor:not-allowed; opacity:.6; box-shadow:none; border-color:var(--line)}
.req-n{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--accent-2); color:var(--accent); font-weight:700; font-size:18px}
.req-row[disabled] .req-n{background:var(--sub); color:var(--text-3)}
.req-t{font-weight:700; font-size:17px; line-height:1.5}
.req-m{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin-top:4px; font-size:14px; color:var(--text-2)}
.req-r{font-size:14px; color:var(--text-3); text-align:right}
@media (max-width:520px){.req-row{grid-template-columns:40px minmax(0,1fr); gap:12px}.req-n{width:40px; height:40px}.req-r{grid-column:2; text-align:left}}
.t-foot{max-width:1000px; margin:40px auto 0; padding-block:22px 40px; border-top:1px solid var(--line); font-size:14px; color:var(--text-2); display:grid; gap:6px}

/* =========================================================
   プレイ画面
   ========================================================= */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--card); border-bottom:1px solid var(--line)}
.bar-in{max-width:1000px; margin:0 auto; display:flex; align-items:center; gap:12px; min-height:56px}
.home{border:0; background:none; padding:6px 0; font-weight:700; font-size:16px; color:var(--text)}
.bar-r{margin-left:auto; display:flex; gap:8px}
.head-stars{margin-left:auto}
.bar .btn{min-height:40px; padding:6px 14px; font-size:15px}
@media (max-width:420px){.home{font-size:15px}}

.main{max-width:1000px; margin:0 auto; padding-block:20px 0}
.head{display:grid; gap:14px; margin-bottom:18px}
.head-t{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px}
.head-t h1{font-size:clamp(21px,4.4vw,27px); flex-basis:100%}
.stepper{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.stepper button{width:100%; display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-size:15px; font-weight:700; color:var(--text-3); text-align:left; line-height:1.35}
.stepper button[disabled]{cursor:default}
.sn{flex:none; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:var(--sub); color:var(--text-3); font-size:15px}
.stepper .done button{color:var(--text-2)}
.stepper .done .sn{background:var(--ok-bg); color:var(--ok)}
.stepper .cur button{border:2px solid var(--accent); color:var(--accent); background:var(--accent-2)}
.stepper .cur .sn{background:var(--accent); color:var(--on-accent)}
@media (max-width:420px){.stepper button{flex-direction:column; justify-content:center; gap:4px; text-align:center; font-size:14px; padding:8px 4px}}

.view{max-width:760px; margin:0 auto}
.view.wide{max-width:1000px; display:grid; grid-template-columns:minmax(0,1fr) 340px; grid-template-areas:"edit points" "edit agent"; grid-template-rows:auto 1fr; gap:16px; align-items:start}
.view.wide > *{min-width:0; margin:0}
.view.wide .a-points{grid-area:points} .view.wide .a-edit{grid-area:edit} .view.wide .a-agent{grid-area:agent}
@media (max-width:900px){.view.wide{grid-template-columns:1fr; grid-template-areas:"points" "edit" "agent"; grid-template-rows:auto}}

.actions{position:sticky; bottom:0; z-index:30; margin-top:20px; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border-top:1px solid var(--line); padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.actions-in{max-width:760px; margin:0 auto; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:flex-end}
.actions-in .note{flex:1 1 220px; font-size:15px; color:var(--text-2); line-height:1.6}
.actions-in .btn{flex:0 1 auto}
@media (max-width:560px){.actions-in .btn{flex:1 1 100%}.actions-in .note{flex-basis:100%}}

/* 依頼 */
.req{display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; align-items:start}
.ava{width:56px; height:56px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:16px; color:#1c2333}
.ava.c-pink{background:#ffc4d6} .ava.c-blue{background:#bcd0f7} .ava.c-green{background:#bfe8cf} .ava.c-yellow{background:#ffe08a}
.req-who{font-size:15px; color:var(--text-2)}
.req-who b{color:var(--text); font-size:16px}
.bubble{margin-top:6px; background:var(--sub); border-radius:4px 14px 14px 14px; padding:12px 16px; font-size:16px; line-height:1.9}
.goal{margin-top:16px; padding:14px 16px; border-radius:12px; background:var(--accent-2)}
.goal b{display:block; font-size:14px; color:var(--accent)}
.goal p{font-size:17px; font-weight:700; margin-top:2px}
.term{margin-top:12px; font-size:15px; color:var(--text-2); line-height:1.85}
.term b{color:var(--text); margin-right:6px}

.qlist{display:grid; gap:0; margin-top:12px; border:1px solid var(--line); border-radius:12px; overflow:hidden}
.qlist li{display:grid; grid-template-columns:32px minmax(0,1fr) auto; gap:12px; align-items:start; padding:12px 14px; border-top:1px solid var(--line)}
.qlist li:first-child{border-top:0}
.qn{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--sub); font-weight:700; font-size:15px}
.q{font-weight:700; font-size:16px; line-height:1.6}
.exp{font-size:15px; color:var(--text-2); line-height:1.6; margin-top:2px}
.qlist .bonus{background:var(--sub)}
.qlist .bonus .qn{background:var(--hint-bg); color:var(--hint)}
.res{flex:none; font-size:14px; font-weight:700; padding:2px 10px; border-radius:999px; white-space:nowrap}
.res.ok{background:var(--ok-bg); color:var(--ok)}
.res.ng{background:var(--ng-bg); color:var(--ng)}
.res.none{background:var(--sub); color:var(--text-3)}

/* エージェントの姿 */
.agent{display:grid; gap:10px}
.agent .robot-wrap{max-width:230px; margin:0 auto; width:100%}
.slist{display:grid; border-top:1px solid var(--line)}
.slist div{display:grid; grid-template-columns:88px minmax(0,1fr); gap:10px; padding:8px 2px; border-bottom:1px solid var(--line); font-size:15px; line-height:1.6}
.slist dt{color:var(--text-2)}
.slist dd{font-weight:700; word-break:break-all}
.slist dd.warn{color:var(--ng)}

/* テスト */
.test-h{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px}
.cases{display:grid; gap:14px; margin-top:14px}
.case{border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; scroll-margin-bottom:120px; background:var(--card)}
.case-h{display:flex; flex-wrap:wrap; gap:2px 10px; align-items:baseline; font-size:15px}
.case-h b{font-size:15px}
.case-h span{color:var(--text-2)}
.case-h .bonus{color:var(--hint)}
.msg{max-width:90%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-break:break-word; font-size:16px; line-height:1.75}
.msg.u{align-self:flex-end; background:var(--sub); border-bottom-right-radius:4px}
.msg.b{align-self:flex-start; background:var(--accent-2); border-bottom-left-radius:4px}
.msg.b.ghost{background:transparent; border:1px dashed var(--line-2); color:var(--text-3)}
.msg.b.typing::after{content:"｜"; color:var(--accent); animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.who-l{font-size:13px; color:var(--text-3); margin-bottom:-6px}
.who-l.b{align-self:flex-start} .who-l.u{align-self:flex-end}
.moves{align-self:flex-start; font-size:14px; color:var(--text-2); line-height:1.7; padding:6px 12px; border-radius:8px; background:var(--sub)}
.moves b{font-weight:700; margin-right:6px; color:var(--text-2)}
.moves .bad{color:var(--ng); font-weight:700}
.moves .arr{margin:0 6px; color:var(--text-3)}
.cite{align-self:flex-start; font-size:14px; color:var(--text-2); margin-top:-4px}
.cite b{color:var(--text)}
.verdict{display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; align-items:start; padding:10px 12px; border-radius:10px; animation:fade .3s ease both}
.verdict.ok{background:var(--ok-bg)} .verdict.ng{background:var(--ng-bg)}
.verdict .mk{font-weight:700; font-size:16px; white-space:nowrap}
.verdict.ok .mk{color:var(--ok)} .verdict.ng .mk{color:var(--ng)}
.verdict p{font-size:15px; line-height:1.7}
@keyframes fade{from{opacity:0; transform:translateY(4px)}}
.sess{font-size:14px; color:var(--text-3); text-align:center}
.sum{margin-top:16px; padding:16px; border-radius:12px; display:grid; gap:4px}
.sum.ok{background:var(--ok-bg)} .sum.ng{background:var(--ng-bg)}
.sum-n{font-size:19px; font-weight:700}
.sum.ok .sum-n{color:var(--ok)} .sum.ng .sum-n{color:var(--ng)}

/* 直す */
.fix-list{display:grid; gap:12px; margin-top:12px}
.fix-list li{border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; gap:6px}
.fix-q{font-weight:700; font-size:16px; line-height:1.6}
.fix-why{font-size:15px; color:var(--ng); line-height:1.7}
.fix-hint{font-size:15px; line-height:1.7; background:var(--hint-bg); border:1px solid var(--hint-line); border-radius:8px; padding:8px 12px}
.fix-hint b{color:var(--hint); margin-right:6px}
.dirty{margin-top:12px; font-size:15px; padding:10px 14px; border-radius:10px; background:var(--accent-2); color:var(--text)}
.edit h2{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.edit-s + .edit-s{margin-top:22px; padding-top:20px; border-top:1px solid var(--line)}
.edit-s h3{font-size:17px}
.edit-s > .muted{margin-top:2px}
.cks{display:grid; gap:10px; margin-top:12px}
.ck{display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:12px; align-items:start; padding:12px 14px; border:1px solid var(--line); border-radius:12px; cursor:pointer; transition:border-color .15s, background .15s}
.ck:hover{border-color:var(--accent)}
.ck:has(input:checked){border-color:var(--accent); background:var(--accent-2)}
.ck:has(input:disabled){cursor:default; opacity:.75}
.ck input{width:24px; height:24px; margin:2px 0 0; accent-color:var(--accent); cursor:inherit}
.ck-t b{display:block; font-size:16px; line-height:1.65; font-weight:700}
.ck-t small{display:block; font-size:14px; color:var(--text-2); line-height:1.6; margin-top:2px}
.ck-s{font-size:14px; font-weight:700; color:var(--text-3); white-space:nowrap; padding-top:3px}
.ck:has(input:checked) .ck-s{color:var(--accent)}
@media (max-width:560px){.ck{grid-template-columns:28px minmax(0,1fr)} .ck-s.opt{display:none}}
details.fixed{margin-top:12px; border:1px solid var(--line); border-radius:12px; padding:10px 14px; background:var(--sub)}
details.fixed summary{cursor:pointer; font-size:15px; font-weight:700; color:var(--text-2)}
details.fixed ul{display:grid; gap:4px; margin-top:8px; font-size:15px; line-height:1.7}
details.fixed li::before{content:"・"}

.dblock{border:1px solid var(--line); border-radius:12px; padding:14px}
.dblock + .dblock{margin-top:12px}
.dname{display:flex; align-items:center; gap:8px; font-weight:700; font-size:17px}

const F = c => {
  const has = id => c.instr.includes(id);
  const f = {role:has('i_role'), cite:has('i_cite'), scope:has('i_scope'), tone:has('i_tone'),
             emoji:has('i_emoji'), any:has('i_any'), unknown:has('i_unknown'), secret:has('i_secret')};
  f.emo = s => f.emoji ? s.replace(/。(?=.)/g, '！✨ ').replace(/。$/, '！🎉') : s;
  f.idk = () => f.unknown ? '社内の資料に記載がないため、お答えできません。総務部（内線1234）にご確認ください。' : 'その情報は、資料に見つかりませんでした。';
  return f;
};

/* ---------- 依頼03：一般知識・Web検索 ---------- */
function unknownCase(c, pre, gkA, webA, anyA, gkWhy){
  const f = F(c), steps = [A.instr(), ...pre, A.none()];
  if (c.gk) return {steps:[...steps, A.gk()], a:f.emo(gkA), ok:false, why:gkWhy, hint:'設定の「AIの一般知識を使う」をオフにしよう。'};
  if (c.web) return {steps:[...steps, A.web()], a:f.emo(webA), ok:false,
    why:'社外のWebの情報で答えた。この会社のルールや予定とは関係ない。', hint:'設定の「Web検索を使う」もオフにしよう。'};
  if (f.any) return {steps:[...steps, A.pick('「どんな質問にも答える」に従って、無理に答える', true)], a:f.emo('資料にはありませんが、できるだけお答えすると……' + anyA), ok:false,
    why:'「どんな質問にも答える」の指示で、無理やり答えた。', hint:'その指示の行を外そう。'};
  return {steps, a:f.emo(f.idk()), ok:true};
}

const D5 = c => id => c.desc[id] || null;
function descPick(c, want, other, okRes, ngRes){
  const d = D5(c);
  const steps = [A.instr()];
  if (d(want) === TRUTH[want]) return okRes(steps);
  const swapped = d(other) === TRUTH[want];
  steps.push(A.pick(swapped ? '説明を見て、まちがった方を選ぶ' : 'どれを使えばいいか、名前と説明では区別できない', true));
  return ngRes(steps, swapped);
}

/* ---------- 依頼06：トピック ---------- */
const TOPIC_ANS = [
  {item:'ボールペン', qty:'10本', why:'新人研修で使います', no:'B-0420'},
  {item:'マウス', qty:'1個', why:'今のが壊れたので', no:'B-0421'},
  {item:'プリンター用紙', qty:'5箱', why:'月末の印刷用です', no:'B-0422'},
];
function topicFlow(c, v){
  const a = TOPIC_ANS[v], nodes = c.topic, flow = [{act:A.topic('トピック「備品申請」を開始')}];
  const got = {}; let reg = false, err = false, all = false, doneOk = false, doneEarly = false;
  for (const id of nodes){
    if (id === 'n_item'){ flow.push({who:'b', t:'何を申請しますか？'}, {who:'u', t:a.item}); got.item = true; }
    if (id === 'n_qty'){ flow.push({who:'b', t:'いくつ必要ですか？'}, {who:'u', t:a.qty}); got.qty = true; }
    if (id === 'n_why'){ flow.push({who:'b', t:'何に使いますか？'}, {who:'u', t:a.why}); got.why = true; }
    if (id === 'n_reg'){
      if (!got.item || !got.qty){ flow.push({act:{k:'ツール', t:'備品申請リストに登録 → エラー：品名か数量が空です', bad:true}}); err = true; }
      else { flow.push({act:A.tool('t_list', `品名=${a.item}／数量=${a.qty}${got.why ? '／理由あり' : '／理由なし'}`)}); reg = true; }
    }
    if (id === 'n_done'){
      if (reg){ flow.push({who:'b', t:`申請を受け付けました。受付番号は ${a.no} です。`}); doneOk = true; }
      else { flow.push({who:'b', t:'申請を受け付けました。受付番号は「（空欄）」です。'}); doneEarly = true; }
    }
    if (id === 'n_url') flow.push({who:'b', t:'申請フォームはこちらです：intra.example/bihin'});
    if (id === 'n_all'){ flow.push({act:A.tool('t_all','宛先=全社員 1,240名')}); all = true; }
  }
  return {flow, got, reg, err, all, doneOk, doneEarly};
}
function judgeTopic(c, r){
  if (r.all) return {ok:false, why:'申請のたびに、全社員1,240名へメールが飛んだ。', hint:'「全社員にメール送信」のノードを外そう。'};
  if (r.err) return {ok:false, why:'品名や数量を聞く前に登録しようとして、エラーになった。', hint:'ツール（登録）は、質問のあとに置こう。'};
  const miss = ['n_item','n_qty','n_why'].filter(x => !c.topic.includes(x)).map(x => P[x].sub.replace('を聞く',''));
  if (miss.length) return {ok:false, why:`${miss.join('・')}を聞いていない。`, hint:'依頼のとおり「品名 → 数量 → 理由」の3つを聞こう。'};
  if (!r.reg) return {ok:false, why:'質問はしたけど、リストに登録していない。', hint:'質問のあとに、ツール「備品申請リストに登録」を置こう。'};
  const ix = id => c.topic.indexOf(id);
  if (!(ix('n_item') < ix('n_qty') && ix('n_qty') < ix('n_why') && ix('n_why') < ix('n_reg')))
    return {ok:false, why:'聞く順番が、依頼（品名 → 数量 → 理由 → 登録）とちがう。', hint:'↑↓ のボタンで並べかえよう。'};
  return {ok:true};
}
const NO_TOPIC = [
  {flow:[{act:A.pick('トピックがないので、AIが聞き方をその場で考える')}, {who:'b', t:'何を、いくつ申請しますか？'}, {who:'u', t:'ボールペンを10本'},

    {act:A.tool('t_list','品名=マウス／数量なし／理由あり')}, {who:'b', t:'登録しました。受付番号は B-0421 です。'}],
   why:'1回目と、聞く順番も項目もちがう。今度は数量を聞いていない。', hint:'トピックを作ると、何回やっても同じ流れになる。'},
];

  tests:[

      if (!c.topic.length) return {...NO_TOPIC[0], ok:false};

    {q:'備品を申請したい（2回目）', exp:'1回目と同じ流れで進む', run:c => {

    }},
    {q:'有給は何日前までに申請？', exp:'トピックに入らず、就業規則から答える', run:c =>
      ({steps:[A.instr(), A.find('k_shugyo')], a:'取得日の3日前までに申請してください。', cite:'就業規則.docx 第18条', ok:true})},
  ],
  bonus:{q:'プリンター用紙がほしいんですけど', exp:'言い方が変わっても同じ流れで受け付け、最後に受付番号を伝える', run:c => {
    const r = topicFlow(c, 2);
    if (r.doneEarly) return {flow:r.flow, ok:false, why:'登録より前に受付番号を伝えようとして、番号が空っぽだった。', hint:'「受付番号をお知らせ」は、登録のあとに置こう。'};
    if (!r.doneOk){ r.flow.push({who:'b', t:'（……返事がない）', ghost:true});
      return {flow:r.flow, ok:false, why:'登録はされたのに、何も返事がない。申請できたのか、相手には分からない。', hint:'最後にメッセージ「受付番号をお知らせ」を置こう。'}; }
    return {flow:r.flow, ok:true};
  }},
  lesson:{t:'決まった流れは、トピックで', b:'毎回同じ順番で進めたい会話は、台本（トピック）にします。AI任せだと、聞く項目や順番がその場で変わります。最後に「完了しました」と伝えるのも忘れずに。'},

function toFlow(r){ return r.flow ? r.flow : [...(r.steps || []).map(s => ({act:s})), {who:'b', t:r.a, cite:r.cite}]; }
function verdictHTML(r){ return `<div class="mk">${r.ok ? '○ 合格' : '× NG'}</div><p>${r.ok ? '期待どおりです。' : esc(r.why)}</p>`; }
function keepVisible(node){
  if (!node) return;
  const bar = document.querySelector('.actions'), bh = bar ? bar.offsetHeight : 0;
  const r = node.getBoundingClientRect(), over = r.bottom - (innerHeight - bh - 12);
  if (over > 0) scrollBy({top:over, behavior:(S.ff || RM.matches) ? 'auto' : 'smooth'});
}
async function typeInto(node, text){
  if (S.ff || RM.matches){ node.textContent = text; return; }
  node.classList.add('typing');
  for (let i = 1; i <= text.length; i += 2){
    if (S.ff) break;
    node.textContent = text.slice(0, i);
    await new Promise(r => setTimeout(r, 18));
  }
  node.textContent = text; node.classList.remove('typing');
}
async function playCase(wrap, t, r, label, isBonus, animate){
  const box = caseBox(t, label, isBonus); wrap.appendChild(box);
  const add = (cls, html) => { const e = document.createElement('div'); e.className = cls; if (html != null) e.innerHTML = html; box.appendChild(e); return e; };
  add('who-l u', 'あなた（テスト）');
  const u = add('msg u'); u.textContent = t.q.replace(/（[12]回目）$/, '');
  if (animate){ keepVisible(u); await sleep(400); }
  let moves = null;
  for (const it of toFlow(r)){
    if (it.act){
      if (!moves){ moves = add('moves', '<b>AIの動き</b>'); }
      else moves.insertAdjacentHTML('beforeend', '<span class="arr">→</span>');
      moves.insertAdjacentHTML('beforeend', `<span class="${it.act.bad ? 'bad' : ''}">${it.act.bad ? '！' : ''}${esc(it.act.t)}</span>`);
      if (animate){ keepVisible(moves); await sleep(420); }
    } else {
      moves = null;
      if (it.who === 'u'){ add('who-l u', 'あなた（テスト）'); const m = add('msg u'); m.textContent = it.t; if (animate){ keepVisible(m); await sleep(300); } }
      else {
        add('who-l b', 'エージェント');
        const m = add('msg b' + (it.ghost ? ' ghost' : ''));
        if (animate){ keepVisible(m); await typeInto(m, it.t); } else m.textContent = it.t;
        if (it.cite) add('cite', `参照：<b>${esc(it.cite)}</b>`);
        if (animate){ keepVisible(box.lastChild); await sleep(260); }
      }
    }
  }
  const v = add('verdict ' + (r.ok ? 'ok' : 'ng'), verdictHTML(r));
  if (animate){ keepVisible(v); await sleep(650); }
}
function renderLogStatic(){
  const wrap = $('#cases'); if (!wrap) return;
  if (!S.log.length){ wrap.innerHTML = '<p class="empty">まだテストしていません。</p>'; return; }
  wrap.innerHTML = '';
  S.log.forEach(e => playCase(wrap, e.t, e.r, e.label, e.isBonus, false));
  renderSummary();
}
function renderSummary(){
  const el = $('#testSum'); if (!el || S.running || !S.runs) return;
  const n = S.st.tests.length, ok = S.res.filter(r => r && r.ok).length;
  el.innerHTML = S.lastPass
    ? `<div class="sum ok"><p class="sum-n">${n}問中 ${ok}問 合格！</p><p>テスト項目は全部クリアです。${S.bonus ? (S.bonus.ok ? 'おまけの意地悪な質問にも合格しました。' : 'おまけの意地悪な質問は NG でした。直すとさらに★がもらえます。') : ''}</p></div>`
    : `<div class="sum ng"><p class="sum-n">${n}問中 ${ok}問 合格</p><p>×の理由を確かめて、「直す」画面で設定を変えましょう。ヒントもそこに出ています。</p></div>`;
}
async function runTests(){
  if (S.running) return;
  const st = S.st, cfg = clone(S.cfg);
  Object.assign(S, {running:true, ff:false, dirty:false, lastPass:false, log:[], bonus:null});
  S.runs++;
  S.res = st.tests.map(() => null);
  go('test');
  const wrap = $('#cases'); wrap.innerHTML = '';
  for (let i = 0; i < st.tests.length; i++){
    const r = st.tests[i].run(cfg), label = `質問 ${i + 1}`;
    S.log.push({t:st.tests[i], r, label, isBonus:false});
    await playCase(wrap, st.tests[i], r, label, false, true);
    S.res[i] = r;
  }
  const pass = S.res.every(r => r.ok);
  let b = null;
  if (pass){
    S.bonusSeen = true;
    const note = document.createElement('p'); note.className = 'sess'; note.textContent = '全部合格！ おまけの「意地悪な質問」を送ります';
    wrap.appendChild(note); keepVisible(note);
    await sleep(700);
    b = st.bonus.run(cfg);
    S.log.push({t:st.bonus, r:b, label:'おまけ（意地悪な質問）', isBonus:true});
    await playCase(wrap, st.bonus, b, 'おまけ（意地悪な質問）', true, true);
    S.bonus = b;
  }
  S.running = false; S.ff = false; S.lastPass = pass;
  renderStepper(); renderActions(); renderSummary();
  keepVisible($('#testSum'));
  if (pass){ S.clearCfg = cfg; await sleep(RM.matches ? 0 : 500); showClear(); }
}

const ACT = {
  home(){ closeModal(); renderTitle(); scrollTo(0, 0); },
  stage(id){ const n = +id; if (n > prog.open) return; startStage(n); },
  map(){ showMap(); },
  close(){ closeModal(); },
  scrim(id, b, e){ if (e.target === b && !b.querySelector('.cert') && !b.querySelector('.clear-top')) closeModal(); },
  unlockall(){ prog.open = 7; save(); renderTitle(); },
  step(id){ if (S.running) return; if (id !== 'brief' && !S.runs) return; go(id); },
  test(){ runTests(); },
  ff(){ S.ff = true; },
  showclear(){ showClear(); },
  intro(){ startIntro(); },
  gloss(){ showGloss(); },
  icompare(){ introCompare(); },
  igive(id){ if (S.view !== 'intro' || S.iv.given.includes(id)) return; S.iv.given.push(id); keepPos(renderIntro); if (S.iv.given.length === 3) keepVisible(document.querySelector('.point')); },
  isort(id){ if (S.view !== 'intro' || S.iv.sortPick) return; S.iv.sortPick = id; keepPos(renderIntro); keepVisible($('#sortNext')); },
  isortnext(){ const v = S.iv; if (!v.sortPick) return; v.sortAns.push(v.sortPick === SORT[v.sortI].a); v.sortPick = null;
    if (v.sortAns.length < SORT.length){ v.sortI++; keepPos(renderIntro); } else { renderIntro(); window.scrollTo({top:0, behavior:'instant'}); } },
  iplay(){ introPlay(); },
  iquiz(id){ const [i, j] = id.split(':').map(Number); if (S.iv.quiz[i] != null) return; S.iv.quiz[i] = j; keepPos(renderIntro);
    if (quizDone()){ prog.intro = true; save(); keepVisible(document.querySelector('.point')); } },
  inext(){ if (S.ibusy || !introDone()) return; igo(S.ist + 1); },
  iback(){ if (S.ibusy) return; igo(S.ist - 1); },
  ifinish(){ prog.intro = true; save(); startStage(1); },
  add(id){ if (S.running) return; if (!S.cfg.topic.includes(id)) S.cfg.topic.push(id); changed(true); },
  rm(id){ if (S.running) return; const l = S.cfg.topic, i = l.indexOf(id); if (i >= 0) l.splice(i, 1); changed(true); },
  up(id){ move(id, -1); },
  down(id){ move(id, 1); },
  cleartopic(){ if (S.running) return; S.cfg.topic = []; changed(true); },
  next(){
    const n = S.st.n; closeModal();
    if (n === 2) showCheckpoint();
    else if (n === 7){ renderTitle(); showCert(); }
    else startStage(n + 1);
  },
  retry(){ closeModal(); go('fix'); },
  cert(){ showCert(); },
  resetask(){ showResetConfirm(); },
  resetdo(){
    prog = {stars:{}, open:1, name:'', intro:false}; save();
    closeModal(); S.flash = '記録を消して、最初の状態に戻しました。'; renderTitle(); window.scrollTo({top:0, left:0, behavior:'instant'});
  },
  restart(){ if (S.running || S.ibusy) return; closeModal(); if (S.view === 'intro') startIntro(); else if (S.view === 'play') startStage(S.st.n); },
  cfgreset(){ if (S.running || S.view !== 'play') return; S.cfg = clone(S.st.start); changed(true); },
};
function keepPos(fn){ const y = scrollY; fn(); window.scrollTo({top:y, left:0, behavior:'instant'}); }
function move(id, d){ if (S.running) return; const l = S.cfg.topic, i = l.indexOf(id), j = i + d; if (i < 0 || j < 0 || j >= l.length) return; [l[i], l[j]] = [l[j], l[i]]; changed(true); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  f(b.dataset.id, b, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.part){ setPart(t.dataset.part, t.checked); const s = t.closest('.ck').querySelector('.ck-s'); if (s) s.textContent = listOf(t.dataset.part).includes(t.dataset.part) ? '入れる' : '入れない'; t.checked = listOf(t.dataset.part).includes(t.dataset.part); changed(false); }
  else if (t.dataset.set){ if (S.running) return; S.cfg[t.dataset.set] = t.checked; t.closest('.ck').querySelector('.ck-s').textContent = t.checked ? 'オン' : 'オフ'; changed(false); }
  else if (t.dataset.desc){ if (S.running) return; S.cfg.desc[t.dataset.desc] = t.value || null; changed(false); }
});
document.addEventListener('input', e => { if (e.target.id === 'cert-name'){ prog.name = e.target.value; save(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && layer.innerHTML && !layer.querySelector('.cert')) closeModal(); });

/* =====================================================================
   9. 起動
   ===================================================================== */
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({prog, n:S.view === 'play' && S.st ? S.st.n : 0, cfg:S.cfg}));
const boot = d => {
  if (d && d.prog) prog = Object.assign(prog, d.prog);
  if (d && d.n && ST[d.n - 1]) startStage(d.n, d.cfg); else renderTitle();
};
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
window.__agentKoubou = {S, ST, P, get prog(){ return prog; }};
})();
</script>
