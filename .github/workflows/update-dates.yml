# pages/ にページが増えたり消えたりしたら、トップページの「新着順」で使う dates.json を作り直す
name: Update dates.json

on:
  push:
    branches: [main]
    paths: ["pages/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 最初に追加された日を調べるので、履歴をすべて取る

      - name: Rebuild dates.json
        run: python3 .github/scripts/update_dates.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- dates.json && git ls-files --error-unmatch dates.json >/dev/null 2>&1; then
            echo "dates.json に変更はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dates.json
          git commit -m "Update dates.json"
          # ほかの push と重なったら、取り込んでからやり直す
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
            git pull --rebase origin main
          done
          exit 1
